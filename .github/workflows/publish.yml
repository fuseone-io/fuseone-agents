# What an installation actually receives.
#
# Two artefacts and they travel together: the image, and the chart that knows
# how to run it. Publishing one without the other leaves a customer holding
# something they cannot install. A third, the factory's MCP sidecar image,
# rides along from the same Dockerfile; nothing in the chart refers to it.
#
# Both go to this repository's own registry, which is what the chart already
# defaults to. Nothing is published from a pull request — a fork must not be
# able to push an image the tag `main` resolves to.
name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Applies to the branch only. GitHub does not evaluate path filters on tag
    # pushes, so a release tag publishes whatever its commit touched — even a
    # docs-only commit. One push trigger is all a workflow may declare.
    paths-ignore:
      - "docs/**"
      - ".github/workflows/docs.yml"
  # For rebuilding a release without a new commit, which is what happens when a
  # base image is patched.
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Nothing is published from a commit that has not passed. The reusable call
  # runs the whole of check.yml, so this is the same gate a pull request meets
  # rather than a second, laxer one.
  check:
    uses: ./.github/workflows/check.yml

  image:
    name: image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless signing: the identity is this workflow, so there is no key to
      # store and none to leak.
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      # arm64 without emulation: the Dockerfile pins its build stages to the
      # building machine and cross-compiles, so this only has to describe the
      # platforms.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A tag says where an image came from. `main` moves, `sha-` never does,
      # and a version tag is what an installation pins.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # What `agentd version` and /readyz will report, and it is deliberately
      # the same string as a tag this job pushes. The first run reported
      # `main-d12972e` for an image tagged `sha-d12972e`: two names for one
      # thing, which is the confusion this argument exists to prevent — an
      # operator reading the version off a live pod has to be able to pull it.
      - id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The version the binary reports. `agentd version` and the image tag
          # disagreeing is how an incident gets diagnosed against the wrong
          # code.
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # This platform is installed inside somebody else's network, where
          # nobody can watch it build. What it can offer instead is an account
          # of how it was built and a bill of what is in it.
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@v3

      - name: sign the digest
        run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}

  # The software factory's MCP server, run as a sidecar beside the worker.
  # Its own image, so an installation that does not run the factory never
  # pulls it, published from the same commits with the same tags, provenance,
  # bill of materials and signature as agentd: a sidecar in the worker's pod
  # is as much inside the perimeter as the worker.
  factory-mcp-image:
    name: factory-mcp image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      FACTORY_IMAGE: ghcr.io/${{ github.repository }}-factory-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The same tag set as agentd's, so `0.90.0` of one names the commit
      # `0.90.0` of the other was built from.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FACTORY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: factory-mcp
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Its own cache scope: sharing agentd's default one in mode=max, the
          # two builds would evict each other's layers on every push.
          cache-from: type=gha,scope=factory-mcp
          cache-to: type=gha,scope=factory-mcp,mode=max
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@v3

      - name: sign the digest
        run: cosign sign --yes ${{ env.FACTORY_IMAGE }}@${{ steps.push.outputs.digest }}

  chart:
    name: chart
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: log in to the registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ${{ env.REGISTRY }} \
                --username ${{ github.actor }} --password-stdin

      # Two versions, and they are not the same string.
      #
      # The chart's own version has to be semver, so a build off main is a
      # prerelease. Its appVersion is something else entirely: the chart uses
      # it as the image tag, so it has to be a tag the image job actually
      # pushed. Setting both to the chart version published a chart pointing at
      # an image tag that did not exist, and the failure was an ImagePullBackOff
      # five minutes into an install — as far from the mistake as it could land.
      - name: package
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            app="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-main.$(git rev-parse --short HEAD)"
            app="sha-$(git rev-parse --short HEAD)"
          fi
          helm package deploy/helm/fuseone-agents \
            --version "$version" --app-version "$app" -d /tmp/chart
          echo "CHART=$(ls /tmp/chart/*.tgz)" >> "$GITHUB_ENV"

      - name: push
        run: helm push "$CHART" oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts

  release:
    name: github release
    # Announced only once every image the release names exists.
    needs: [chart, factory-mcp-image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: extract notes
        run: |
          bash scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > /tmp/release-notes.md

      - name: create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file /tmp/release-notes.md \
              --verify-tag
          fi
