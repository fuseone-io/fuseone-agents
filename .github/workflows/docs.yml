name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/site/package-lock.json

      - name: Install
        working-directory: docs/site
        run: npm ci

      - name: Build
        working-directory: docs/site
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/site/dist
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: docs-site-dist

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish to gh-pages/docs
        run: |
          set -euo pipefail
          dist="$PWD/docs-site-dist"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages:gh-pages
            git worktree add pages gh-pages
          else
            git worktree add --orphan -b gh-pages pages
            (cd pages && git rm -rf . 2>/dev/null || true)
          fi

          rm -rf pages/docs
          mkdir -p pages/docs
          cp -r "$dist"/. pages/docs/

          # GitHub Pages will not serve Astro assets under _astro/ unless
          # Jekyll is disabled for the branch.
          touch pages/.nojekyll

          (
            cd pages
            git add docs .nojekyll
            if git diff --cached --quiet; then
              echo "no docs changes; skipping push"
              exit 0
            fi
            git commit -m "docs: publish ${GITHUB_SHA:0:7}"
            git push origin gh-pages
          )
