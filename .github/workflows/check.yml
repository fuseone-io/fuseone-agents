# Everything `make check`, `make check-pg` and `make smoke` do, on every push.
#
# The point of the postgres job is that it cannot silently skip: the contract
# suites are the only place the in-memory ledger is checked against the real
# one, and they skip when TEST_DATABASE_URL is unset. REQUIRE_DATABASE turns
# that skip into a failure, so a mistyped variable fails loudly instead of
# quietly halving the suite for as long as nobody notices.
name: check

on:
  pull_request:
  # Called by publish.yml, so a commit on main meets this gate exactly once and
  # publishing cannot run against a laxer copy of it.
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '^web/node_modules' || true)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: go vet $(go list ./... | grep -v '/node_modules/')

      # The generated server is committed so this check can exist: it proves
      # the code and api/openapi.yaml still describe the same API. The
      # TypeScript half runs in the console job, which has npm; this job does
      # not, and installing one here would make every Go change wait for it.
      - name: generated Go matches the contract
        run: make verify-generate-go

      - name: test
        run: go test $(go list ./... | grep -v '/node_modules/') -count=1 -race

  postgres:
    name: postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: agents
          POSTGRES_PASSWORD: agents
          POSTGRES_DB: agents_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agents"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://agents:agents@127.0.0.1:5432/agents_test
      TEST_SQL_DATABASE_URL: postgres://sqlconn:sqlconn@localhost:5434/appx_test?sslmode=verify-full&sslrootcert=${{ github.workspace }}/.dev/sql-postgres-certs/ca.crt
      TEST_SQL_WRITER_DATABASE_URL: postgres://sqlwriter:sqlwriter@localhost:5434/appx_test?sslmode=verify-full&sslrootcert=${{ github.workspace }}/.dev/sql-postgres-certs/ca.crt
      TEST_SQL_ADMIN_DATABASE_URL: postgres://sqladmin:sqladmin@localhost:5434/appx_test?sslmode=verify-full&sslrootcert=${{ github.workspace }}/.dev/sql-postgres-certs/ca.crt
      REQUIRE_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: start the governed SQL target
        run: make sql-db

      # Through the Makefile rather than as a list here. This job carried its
      # own copy and had fallen three packages behind, so CI was running fewer
      # suites than `make check-pg` did locally — and the missing ones were the
      # newest, which is the worst possible bias.
      - name: contract suites against a real database
        run: make test-pg

  web:
    name: console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      # The other half of the contract check. Both sides are verified, each in
      # the job that owns its toolchain — a contract checked on one side only
      # is how the console kept speaking a type the server had already dropped.
      - name: generated TypeScript matches the contract
        run: make verify-generate-ts
        working-directory: .
      # Explicit rather than implied by the build: a failure here should read
      # as "the types are wrong", not as "the bundle did not produce".
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  chart:
    name: chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: lint
        run: helm lint deploy/helm/fuseone-agents

      # Rendered and checked against the real schemas. `helm lint` only proves
      # the templates produce YAML; this proves the YAML is Kubernetes.
      - name: install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform

      - name: manifests are valid Kubernetes
        run: |
          helm template fuseone-agents deploy/helm/fuseone-agents \
            --set secret.values.databaseUrl=postgres://u:p@h:5432/d \
            --set secret.values.masterKey=ZGV2ZWxvcG1lbnQtb25seS1rZXktZG8tbm90LXVzZSE= \
            --set ingress.enabled=true --set ingress.host=agents.example.com \
            | kubeconform -strict -summary -kubernetes-version 1.31.0 \
                -schema-location default

  artifact:
    name: artifact
    runs-on: ubuntu-latest
    needs: [go, web]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: agents
          POSTGRES_PASSWORD: agents
          POSTGRES_DB: agents
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agents"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `make smoke` builds the console into the binary, so this job needs the
      # console's dependencies as much as the console job does.
      - run: npm ci
        working-directory: web

      # What the binary serves, and what it refuses to — a property of the
      # artefact rather than of the code, which no unit suite can see.
      - name: smoke
        env:
          TEST_DSN: postgres://agents:agents@127.0.0.1:5432/agents
          FUSEONE_MASTER_KEY: ZGV2ZWxvcG1lbnQtb25seS1rZXktZG8tbm90LXVzZSE=
        run: make smoke
