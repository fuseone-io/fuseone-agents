{{- if .Values.gateway.enabled }}
{{- if .Values.ingress.enabled }}
{{- fail "gateway.enabled and ingress.enabled are both set: two objects claiming one hostname is a routing conflict somebody debugs at the wrong layer. Pick one." }}
{{- end }}
{{/*
The Gateway API, for a cluster that has one.

Ingress is frozen and this is its successor, but a chart that only spoke
Gateway would strand every installation whose cluster has no controller for it.
So both exist and neither is assumed, and enabling both is refused above rather
than resolved — a hostname served by two objects is a routing problem that
looks like an application problem.
*/}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "fuseone.fullname" . }}
  labels: {{- include "fuseone.labels" . | nindent 4 }}
spec:
  parentRefs: {{- toYaml .Values.gateway.parentRefs | nindent 4 }}
  {{- with .Values.gateway.hostnames }}
  hostnames: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "fuseone.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
