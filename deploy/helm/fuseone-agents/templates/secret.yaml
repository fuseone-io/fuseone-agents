{{- if not .Values.secret.existingSecret }}
{{/*
Created only when no existing Secret was named.

Putting the database URL and the master key in a values file puts them in
whatever holds that file — a repository, a CI log, a ticket. An installation
that cares provides `secret.existingSecret` and this template renders nothing.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fuseone.fullname" . }}-secret
  labels: {{- include "fuseone.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "set secret.values.databaseUrl, or point secret.existingSecret at a Secret holding DATABASE_URL and FUSEONE_MASTER_KEY" .Values.secret.values.databaseUrl | quote }}
  FUSEONE_MASTER_KEY: {{ required "set secret.values.masterKey — it seals every stored credential, and losing it means re-entering all of them" .Values.secret.values.masterKey | quote }}
{{- end }}
