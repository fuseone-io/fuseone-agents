apiVersion: v1
kind: Service
metadata:
  name: {{ include "fuseone.fullname" . }}
  labels: {{- include "fuseone.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  # Only the API. Worker metrics have their own Service; selecting both here
  # would send console requests to a pod that does not implement the API.
  selector: {{- include "fuseone.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: serve
