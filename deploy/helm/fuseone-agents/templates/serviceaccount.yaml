{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fuseone.serviceAccountName" . }}
  labels: {{- include "fuseone.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
# Nothing here talks to the Kubernetes API. Mounting a token would hand every
# pod a credential it has no use for, and a tool call is model-directed.
automountServiceAccountToken: false
{{- end }}
