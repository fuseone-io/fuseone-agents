openapi: 3.0.3

# OpenAPI 3.0.3 rather than 3.1: every generator in the toolchain supports it
# fully today. Revisit when kin-openapi's 3.1 support is complete.
#
# This file is the contract, not a description of the code. The Go server
# interface and the TypeScript client are both generated from it, and CI fails
# when the committed generated code no longer matches. Change the API here
# first, always.

info:
  title: FuseOne Agents API
  version: 0.1.0
  description: |
    Control API for the FuseOne Agents platform.

    This is the product's API, not a frontend backend. The Console, the CLI,
    CI pipelines and customer integrations are all first-class clients, so
    treat every change as a public contract change.

    All money is an integer in millionths of the installation's currency.
    All timestamps are RFC 3339 in UTC.
  license:
    name: Proprietary

servers:
  - url: /api/v1

security:
  - bearerAuth: []

tags:
  - name: runs
    description: Agent executions and their ledger trail
  - name: approvals
    description: Actions suspended awaiting a human decision
  - name: cost
    description: Consumption rolled up across the scope hierarchy
  - name: system

paths:
  /branding:
    get:
      tags: [system]
      operationId: getBranding
      summary: Installation branding
      description: |
        Public by design: the sign-in and setup screens need to know what
        installation they belong to before there is a session. It carries no
        authority, only the name, images and colour the installation presents.
      security: []
      responses:
        '200':
          description: The branding in force, falling back to the product mark.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Branding' }

  /money:
    get:
      tags: [system]
      operationId: getMoney
      summary: Installation money unit
      description: |
        Public by design: it carries no authority or spend, only the currency
        code the console uses to render Cost.Micros and Budget.Micros. The
        integer still comes from the ledger; this endpoint names the unit.
      security: []
      responses:
        '200':
          description: The currency in force, falling back to the product default.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoneySettings' }

  /manual:
    get:
      tags: [system]
      operationId: getManual
      summary: The manual's index
      description: |
        The pages the console can show, in the order it shows them.

        Authenticated, unlike branding. Branding is public because a sign-in
        screen needs it before there is a session; the manual is read from
        inside the console by somebody who already signed in, so an anonymous
        endpoint would be surface nobody asked for. That the same text is
        public on GitHub is not a reason to serve it here without a session.
      parameters:
        - $ref: '#/components/parameters/ManualLocale'
      responses:
        '200':
          description: Every page, ordered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManualIndex' }

  /manual/{slug}:
    get:
      tags: [system]
      operationId: getManualPage
      summary: One page of the manual
      description: |
        Markdown, not HTML. Rendering belongs to the reader: a server that
        hands out HTML has to be trusted about what it put in it, and the
        console would have no way to tell content from markup.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, maxLength: 120 }
        - $ref: '#/components/parameters/ManualLocale'
      responses:
        '200':
          description: The page, as it was written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManualPage' }
        '404':
          description: No page by that slug in this locale.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /agents:
    get:
      tags: [agents]
      operationId: listAgents
      summary: Published agents
      description: >
        One row per agent, its newest published version, unless every version
        is asked for. A version is immutable: the identifier is the digest of
        the definition's content, so the text a run was pinned to can always be
        read back.
      parameters:
        - $ref: '#/components/parameters/CompanyScope'
        - $ref: '#/components/parameters/Area'
        - name: allVersions
          in: query
          description: Return the publication history instead of the newest version of each agent.
          schema: { type: boolean, default: false }
        - name: retired
          in: query
          description: >
            Return the agents taken out of circulation instead of the ones in
            it. Their runs are still readable, so somebody reading one has to
            be able to find the agent it belonged to.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Published agents.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Agent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /runs:
    get:
      tags: [runs]
      operationId: listRuns
      summary: List runs
      parameters:
        - $ref: '#/components/parameters/CompanyScope'
        - $ref: '#/components/parameters/Area'
        - name: agentId
          in: query
          schema: { type: string }
        - name: phase
          in: query
          schema: { $ref: '#/components/schemas/Phase' }
        - name: since
          in: query
          description: Only runs started at or after this instant.
          schema: { type: string, format: date-time }
        - name: q
          in: query
          description: >
            Matches the run identifier or the agent identifier. Applied where
            the whole set is, so a page of results is the whole answer rather
            than whatever happened to be loaded.
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of runs, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /runs/stats:
    get:
      tags: [runs]
      operationId: getRunStats
      summary: Aggregate counts over runs
      description: >
        Counts every run that matches, not just the page a list would return.
        The console shows these figures as facts, so they are computed where
        the whole set is — never derived from a page.
      parameters:
        - $ref: '#/components/parameters/CompanyScope'
        - $ref: '#/components/parameters/Area'
        - name: agentId
          in: query
          schema: { type: string }
        - name: since
          in: query
          description: Only runs started at or after this instant.
          schema: { type: string, format: date-time }
        - name: until
          in: query
          description: |
            Only runs started before this instant. Needed to close a window:
            a figure compared against another — yesterday against today — is
            wrong if the earlier window has no upper bound.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Aggregates over the matching runs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunStats' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /runtime:
    get:
      tags: [runs]
      operationId: getRuntimeHealth
      summary: Worker queue and recent runtime failures
      description: >
        Operational health for the runtime. It is read from the run projection,
        not from raw logs: codes and provider names are low-cardinality facts,
        while provider bodies stay out of aggregate views. Active phases are
        counted as current work; terminal phases and failures are bounded by
        `since`.
      parameters:
        - $ref: '#/components/parameters/CompanyScope'
        - $ref: '#/components/parameters/Area'
        - name: agentId
          in: query
          schema: { type: string }
        - name: since
          in: query
          description: Only failure buckets last seen at or after this instant. Defaults to the last 24 hours.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Runtime health.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeHealth' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /agents/interview:
    post:
      tags: [agents]
      operationId: interviewAgent
      summary: Turn answers into a draft
      description: |
        The interview's prose answers, translated into specification fields by
        the model Administração points at.

        The model translates and never grants: what comes back is read against
        the tool catalogue, and a name that is not in it is dropped however
        confidently it was proposed. Without that, describing a process
        persuasively would be a way to widen an agent's reach.

        The daily ceiling is checked before the request leaves. What the call
        cost is appended to the administrative trail whether or not the answer
        was usable — the money left the installation either way.
      parameters:
        - name: locale
          in: query
          description: |
            The language the author is writing in, so the assistant is
            instructed in it. Their answers come back quoted in their own
            words, and wrapping them in an instruction written in another
            language is a mismatch the model pays for.

            An unknown language falls back to the installation's default
            rather than failing the call.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InterviewAnswers' }
      responses:
        '200':
          description: The half of a draft the model produced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterviewDraft' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            The assistant is switched off, or its daily ceiling is reached.
            Both are configuration rather than failure, and the form remains
            the way to publish an agent without it.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: |
            The model provider refused in a way that can clear without the
            author changing the interview, such as overload, rate limiting or
            a network failure.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /agents/interview/suggestions:
    post:
      operationId: suggestInterviewAnswers
      tags: [agents]
      summary: Suggest answers from a free description
      description: |
        Reads the author's free description and proposes values for the fixed
        interview fields. The model does not choose questions, tools or steps
        here: it only fills the schema the platform already owns, and the
        author still reviews the answers before the draft is generated.

        The daily authoring ceiling is checked before the request leaves, and
        the cost is appended to the administrative trail whether or not the
        answer was usable.
      parameters:
        - name: locale
          in: query
          description: |
            The language the author is writing in, so the assistant is
            instructed in it. An unknown language falls back to the
            installation's default.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InterviewCapture' }
      responses:
        '200':
          description: Suggested answers for the fixed interview fields.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterviewSuggestions' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            The assistant is switched off, or its daily ceiling is reached.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: |
            The model provider refused in a way that can clear without the
            author changing the description, such as overload, rate limiting or
            a network failure.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /agents/instructions/tokens:
    post:
      tags: [agents]
      operationId: countInstructionTokens
      summary: How large an instruction is, to the model that will read it
      description: |
        Tokenisation belongs to the model. It differs between vendors and
        between generations of the same vendor, so the console cannot compute
        it: an estimate printed under the word "tokens" would be a wrong
        number in the one place somebody goes to size a prompt, and it would
        age with every model released.

        So the count is the provider's own, asked of the model the agent is
        configured to use, with the instruction sent as the system prompt —
        which is where it goes at run time. It is the size of what the author
        wrote, never the size of a turn: a turn also carries the loop
        contract, the transcript so far and the remaining budget.

        Where the provider has no way to answer, the reply says so and carries
        no number. That is a state and not a failure — only Anthropic's wire
        format exposes a counting endpoint — and the console falls back to
        showing characters, labelled as characters.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstructionText' }
      responses:
        '200':
          description: The count, or the reason there is none.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstructionTokens' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /agents/{agentId}:
    get:
      tags: [agents]
      operationId: getAgent
      summary: One published agent, as it was published
      description: |
        The latest version by default, or the exact one asked for. Publishing a
        new version never affects a run already in flight, so an auditor
        opening a run's version reads that version — not whatever is newest
        now.

        This is the only place the definition's text is returned. The list
        deliberately omits it: a page of twenty agents would carry twenty
        bodies of prose nobody asked to read.
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string }
        - name: version
          in: query
          description: A specific version. Defaults to the newest published.
          schema: { type: string }
      responses:
        '200':
          description: The agent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agents/{agentId}/versions:
    put:
      tags: [agents]
      operationId: publishAgent
      summary: Publish a new version of an agent
      description: |
        Creating and editing are the same call, because editing an agent is
        authoring its next version: runs are pinned to versions, and the older
        ones stay the only correct explanation of the runs that used them.

        The definition is rendered back to the file format and published from
        that, so a version stays the digest of its bytes — the same definition
        typed here and written in an editor produce the same version, and
        publishing identical text twice is a no-op rather than a second version
        of the same words.

        An agent nobody has decided about is recorded as paused. Authoring
        never starts anything.
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentDefinition' }
      responses:
        '200':
          description: The published version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentPublished' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /agents/templates:
    get:
      tags: [agents]
      operationId: listTemplates
      summary: Agents somebody can start from
      parameters:
        - name: locale
          in: query
          description: |
            Which language to answer in. The console says which one it is
            rendering; the server does not guess from a header.

            This is the one place the server holds the reader's words rather
            than a code, because `instructions` is not interface text — it is
            the agent's prompt, and an installation whose work arrives in one
            language wants the model reasoning in it.

            An unknown language is answered in the default rather than empty.
          schema: { type: string }
      description: |
        Recurring shapes — triaging a ticket, qualifying a lead, reconciling
        two records, answering an alert — written out so an author adjusts one
        instead of facing an empty page (PRD FU-16).

        A template names no tools. One naming `crm.reply` would be broken in
        every installation that calls its CRM something else, and choosing the
        pack is the author's act: they pick from what the Curator connected.
        What a template carries instead is `needs` — the roles it expects, in
        words, so the author knows what to look for.
      responses:
        '200':
          description: The catalogue.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AgentTemplate' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /agents/events:
    get:
      tags: [agents]
      operationId: getEventGraph
      summary: Who triggers whom
      description: |
        Composition between agents is by event: one publishes a typed event,
        another consumes it as a trigger (PRD SE-10). Neither names the other,
        so this graph is the only place the wiring is visible — and it is
        derived from the published specifications rather than from a table
        somebody maintains beside them, so it cannot disagree with them.

        Edges that go nowhere are included. An event nobody listens to and a
        trigger nothing publishes are the two mistakes this exists to make
        visible, and a picture without them looks correct.
      responses:
        '200':
          description: Every edge.
          content:
            application/json:
              schema:
                type: object
                required: [edges]
                properties:
                  edges:
                    type: array
                    items: { $ref: '#/components/schemas/EventEdge' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /agents/{agentId}/flow:
    post:
      tags: [agents]
      operationId: checkDataFlow
      summary: Where data from outside reaches an act, before publishing
      description: |
        Answered from the definition, without running anything (PRD SE-07).
        Does data this installation did not author reach a tool that acts on
        the world, and through which step?

        It reports; it does not refuse. The path it finds is usually the point
        of the agent — reading something and acting on it is what these things
        are for — and a check that blocked publication would be turned off
        within a week. What it buys is that nobody is surprised on Monday by an
        approval queue they did not expect.

        The Gate still answers the same question per call at runtime, with the
        taint the run actually carries. This is the earlier, cheaper answer.
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentDefinition' }
      responses:
        '200':
          description: What the definition implies.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlowFinding' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /agents/{agentId}/stage:
    put:
      tags: [agents]
      operationId: setAgentStage
      summary: How far this agent is trusted to act alone
      description: |
        Draft may be simulated and may not act. Copilot acts only with a
        person's approval, whatever a policy would otherwise allow. Autonomous
        is judged by the policy set like anything else.

        Promoting takes the authority to cause runs, because that is what it
        does: every action this agent takes from now on is one nobody will be
        asked about. Demoting takes the same authority and is always allowed —
        the platform demotes on its own when people keep overruling an agent,
        and a person must never have less power than the sweep.
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage]
              properties:
                stage: { $ref: '#/components/schemas/Stage' }
      responses:
        '204': { description: Stored. It applies to the next turn of every run. }
        '400':
          description: |
            Leaving Draft without a reviewed simulation. An agent earns its way
            out by being run against occurrences that already happened (FU-10),
            and skipping that is skipping the only check that exists before
            real work.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agents/{agentId}/paused:
    put:
      tags: [agents]
      operationId: setAgentPaused
      summary: Start or stop an agent
      description: |
        Not part of the definition and not versioned: a specification is what
        somebody wrote and never changes, while whether it may start changes on
        an afternoon when something is wrong. Versioning it would put a version
        between a run and the text that actually ran.

        Every way a run can start obeys this — the schedule, a webhook, the
        button, and the command line.

        Starting is refused while the corrections this version was last
        simulated against no longer hold (409). The check is here rather than
        on publishing because a version's identifier is the digest of its own
        bytes: it does not exist until it is published, so nothing can have
        been simulated against it before. Stopping is never refused.
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paused]
              properties:
                paused: { type: boolean }
      responses:
        '204': { description: Recorded. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Corrections this version used to hold no longer hold.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /agents/{agentId}/retired:
    put:
      tags: [agents]
      operationId: setAgentRetired
      summary: Take an agent out of circulation, or bring it back
      description: |
        There is no delete and there will not be one. A run is pinned to a
        version and that version is the only correct explanation of what the
        run did; removing it would leave the ledger pointing at a text nobody
        can read, which is the opposite of what this platform is for.

        Retiring is the honest alternative. The agent leaves every listing and
        cannot be started, and keeps all of it: its versions, its runs, and a
        line in the trail saying who retired it. A listing can ask for the
        retired ones back with `retired=true`.

        Retiring stops it in the same act — an agent the screen says is gone
        that a schedule still fires is worse than one nobody retired, because
        now nobody is looking for it. Bringing one back leaves it stopped, for
        the opposite reason: restoring and starting are two decisions.
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [retired]
              properties:
                retired: { type: boolean }
      responses:
        '204': { description: Recorded. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agents/{agentId}/runs:
    post:
      tags: [agents]
      operationId: startRun
      summary: Open a run of this agent
      description: |
        Opens a run pinned to the newest published version and returns
        immediately. A worker picks it up; nothing is executed inside this
        request, because a tool call can take minutes and a human approval can
        take hours.

        The idempotency key is required, not optional. A double-clicked button,
        a retried request after a timeout, a scheduler firing twice in the same
        minute — each of those is a duplicated run with real effects against
        real systems. Repeating a key returns the run it already opened rather
        than opening another, so a caller that never saw the first answer can
        safely ask again.
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            Unique per intention, not per attempt. The same key always names
            the same run.
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  type: string
                  description: |
                    What the run is about — a ticket, a message, a payload. It
                    is stored outside the ledger like any other content,
                    because it routinely carries personal data.
      responses:
        '201':
          description: The run was opened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '200':
          description: |
            This key already opened a run, and here it is. Not an error: a
            caller retrying after a timeout is doing the right thing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agents/{agentId}/regressions:
    get:
      tags: [agents]
      operationId: listRegressions
      summary: The corrections this agent is held to
      description: |
        Every one of them is re-checked on every future version. A correction
        that could not be checked was refused when it was made, so what is
        listed here is exactly what the battery proves.
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The corpus.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RegressionCase' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [agents]
      operationId: recordRegression
      summary: Correct a case that came out wrong
      description: |
        The author points at a run and says what should have been true of it.
        What is recorded is the checkable half: prose cannot be re-run, and a
        correction that cannot be re-run is a note rather than a correction.

        The occurrence is copied into the corpus. Runs are purged on the
        installation's retention, and a corpus that lost its cases as runs aged
        out would stop checking while still reporting green.
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegressionInput' }
      responses:
        '201':
          description: Recorded, and part of every battery from now on.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegressionCase' }
        '400':
          description: |
            Nothing to check, or a run with no occurrence behind it.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agents/{agentId}/regressions/{caseId}:
    delete:
      tags: [agents]
      operationId: deleteRegression
      summary: Stop holding the agent to a correction
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string }
        - name: caseId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Removed from the corpus. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /agents/{agentId}/comparison:
    get:
      tags: [agents]
      operationId: compareVersions
      summary: What changed between two versions on the same corpus
      description: |
        The question somebody is actually asking when they publish is not
        "does this version pass" but "is it better than the one before it",
        and two reports side by side do not answer it: the reader is left
        matching case identifiers by eye, which works for five cases and
        fails silently at forty.

        Nothing is stored for this. A battery is a set of simulated runs
        naming a version, and each side of the comparison is the newest
        battery run against that version — so this is a fold of two folds,
        with no third account of the same events to keep in step.

        Both versions default to the obvious ones: the current version, and
        the one published before it.
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string }
        - name: from
          in: query
          description: The older version. Defaults to the one published before `to`.
          schema: { type: string }
        - name: to
          in: query
          description: The newer version. Defaults to the agent's current version.
          schema: { type: string }
      responses:
        '200':
          description: What changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionComparison' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            One of the two versions has never been run against the corpus.
            There is nothing to compare, and answering with an empty diff
            would read as "nothing changed".
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /agents/{agentId}/trust:
    get:
      tags: [agents]
      operationId: getAgentTrust
      summary: Promotion evidence for one published agent version
      description: |
        The Trust Center is an aggregate over ledger facts, not a reading of
        the agent's prose. It reports stable evidence codes and counts for the
        version being viewed, with the previous version used only as a
        baseline when both sides have measured evidence.

        The response deliberately carries no prompt text, tool arguments,
        provider diagnostics, Slack text, URLs, headers, secrets or personal
        identifiers beyond the published agent metadata the caller can already
        read.
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string }
        - name: version
          in: query
          description: A specific version. Defaults to the newest published.
          schema: { type: string }
      responses:
        '200':
          description: The trust evidence.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentTrust' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agents/{agentId}/simulations:
    post:
      tags: [agents]
      operationId: startSimulation
      summary: Run this agent against occurrences that already happened
      description: |
        The central safety mechanism, and the only validation legible to
        somebody who cannot read a specification. A human description of a
        process is always incomplete — people describe the happy path and omit
        the exception — and this is what exposes the gap before production.

        Every case is a real run with exactly one thing missing: the call
        itself. The Gate still decides, the ledger still records, the budget
        still reserves. What the tool layer does is answer with nothing, so a
        case that would have written to a real system reports where it would
        have, and changes nothing.

        The cases are uploaded, never fetched from the systems themselves. A
        connector reading the last fifty tickets would end the one property
        that makes this defensible — that authoring never touches production —
        and would be an integration project per customer besides.

        Returns immediately. A set is minutes of model calls, for the same
        reason starting a run returns before the run does.
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            Unique per intention. It names the simulation, so a caller that
            never saw the answer can ask again without starting a second one.
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimulationRequest' }
      responses:
        '202':
          description: The set was accepted and is being run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulationAccepted' }
        '400':
          description: |
            A line that is not JSON refuses the whole file and says which line.
            Running forty-nine of fifty and mentioning nothing would give an
            author coverage that is a lie.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Not one case could be opened — a paused agent, most likely.
            Answering as though the set had started would leave the author
            polling a report that will never have a row.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /agents/{agentId}/simulations/{simulationId}:
    get:
      tags: [agents]
      operationId: getSimulation
      summary: What the agent would have done
      description: |
        A fold of the runs the simulation opened — not a record kept beside
        them. Readable while it is still going: the cases that have finished
        are rows, and `expected` says how many are coming.

        A finished simulation whose row count falls short of `expected` is one
        where some cases never opened a run at all. That is reported rather
        than hidden, because a report that quietly drops what it could not run
        tells an author the set was covered when it was not.
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string }
        - name: simulationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The report so far.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulationReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agents/{agentId}/webhooks:
    get:
      tags: [agents]
      operationId: listWebhooks
      summary: The webhook paths this agent declares
      description: |
        A declared path cannot fire until somebody generates its secret. This
        reports which are armed and which are still closed, so an operator can
        see that a webhook exists and does nothing.
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The declared paths.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Webhook' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agents/{agentId}/webhooks/{path}/secret:
    post:
      tags: [agents]
      operationId: rotateWebhookSecret
      summary: Generate this webhook's secret
      description: |
        Returns the secret once and stores only its hash — what is kept cannot
        be turned back into what a caller sends. There is no way to read it
        again; rotating produces a new one and retires the old.

        This is also how a webhook is first opened. A declared path with no
        secret refuses everything, which is the safe state for a door with an
        agent behind it.
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string }
        - name: path
          in: path
          required: true
          description: The declared path, without a leading slash.
          schema: { type: string }
      responses:
        '200':
          description: The new secret, returned once.
          content:
            application/json:
              schema:
                type: object
                required: [secret, url]
                properties:
                  secret:
                    type: string
                    description: Shown once. Configure the sender with it now.
                  url:
                    type: string
                    description: Where the sender posts.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /runs/throughput:
    get:
      tags: [runs]
      operationId: getThroughput
      summary: Runs per hour, split by what became of them
      description: |
        Runs are bucketed by the hour they started and counted under the phase
        they are in now. That is the honest reading of "how is today going": a
        run that started at nine and is still waiting belongs to nine o'clock
        and to the waiting column, not to whenever it eventually ends.

        Hours with no runs are absent rather than zero. The caller chose the
        period and knows which hours it covers.
      parameters:
        - $ref: '#/components/parameters/CompanyScope'
        - $ref: '#/components/parameters/Area'
        - name: agentId
          in: query
          schema: { type: string }
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: The buckets, oldest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Throughput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /decisions:
    get:
      tags: [runs]
      operationId: listDecisions
      summary: What the Gate has decided, most recent first
      description: |
        Every effect passes the Gate, and this is that record read across runs
        rather than down one. It is how somebody sees whether the
        installation's rules are doing anything: a feed of nothing but
        "allowed" says the policy is not engaging, and a run of escalations on
        one rule says it is engaging too much.

        Each entry names the rule, never a category. "Denied by policy" tells
        a reader nothing about what to change.
      parameters:
        - $ref: '#/components/parameters/CompanyScope'
        - $ref: '#/components/parameters/Area'
        - name: agentId
          in: query
          schema: { type: string }
        - name: since
          in: query
          description: Only decisions taken at or after this instant.
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The decisions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /runs/{runId}:
    get:
      tags: [runs]
      operationId: getRun
      summary: Get one run
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '404': { $ref: '#/components/responses/NotFound' }

  /runs/{runId}/steps:
    get:
      tags: [runs]
      operationId: listRunSteps
      summary: Read the run's ledger trail
      description: |
        Returns the run's steps in order. This is the audit trail: every entry
        is immutable and sealed into a hash chain, so the same request always
        returns the same bytes for the same range.
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: fromSeq
          in: query
          description: First sequence number to return. Defaults to 1.
          schema: { type: integer, format: int64, minimum: 1 }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of steps.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StepPage' }
        '404': { $ref: '#/components/responses/NotFound' }

  /runs/{runId}/steps/{seq}/content:
    get:
      tags: [runs]
      operationId: getStepContent
      summary: Read the content a step references
      description: |
        Resolves the reference a step carries — the proposed tool arguments, a
        tool result, the run's input — and returns the bytes.

        This is deliberately a second request. The trail is read constantly and
        by many people; the content behind it routinely carries personal data,
        so it is fetched only when someone opens the step that needs it. The
        digest lets the caller prove the bytes are the ones the chain sealed.
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: seq
          in: path
          required: true
          description: The step's sequence number.
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: The referenced content.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StepContent' }
        '404': { $ref: '#/components/responses/NotFound' }

  /runs/{runId}/verify:
    post:
      tags: [runs]
      operationId: verifyRun
      summary: Verify the run's hash chain
      description: |
        Walks the chain and reports whether every link is intact. Used by the
        signed export and by the tamper alarm.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Verification result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerifyResult' }
        '404': { $ref: '#/components/responses/NotFound' }

  /runs/{runId}/resume:
    post:
      tags: [runs]
      operationId: resumeRun
      summary: Return a parked run to the queue
      description: |
        Parking withdraws a run because retrying will not help until somebody
        does something — raise a ceiling, fix an upstream, widen a pack. This
        is that somebody saying they have, and the run continues from the exact
        step it stopped at (PRD FO-04, NF-14).

        Deliberately not automatic. A ceiling raised across a company would
        otherwise restart every run that ever hit it, including the ones people
        have since dealt with by hand.
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 500
                  description: What changed, in the words of whoever changed it.
      responses:
        '200':
          description: The run is back in the queue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The run is not parked.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /runs/{runId}/replay:
    get:
      tags: [runs]
      operationId: replayRun
      summary: Would these decisions be made the same way again?
      description: |
        Faithful replay (PRD AU-07). The recorded inputs are fed back through
        the Gate, under the policy set each step names and the specification
        version the run was pinned to, and the answers are compared with what
        was recorded.

        The hash chain proves the steps were not edited. It does not prove they
        were ever the correct output of the rules in force — a chain of
        well-sealed lies verifies perfectly. This is the other half.

        A decision that cannot be re-derived at all is reported as such rather
        than counted either way: a policy snapshot nobody kept, or a trail from
        before the platform recorded the trust stage.

        Nothing is executed. No tool, no model, no network.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: What the replay found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReplayReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /runs/{runId}/compensation:
    get:
      tags: [runs]
      operationId: getCompensation
      summary: What undoing this run would do
      description: |
        The plan, before anybody performs it. Reverse order — the charge is
        refunded before the order it paid for is cancelled — with the acts
        nothing undoes reported rather than dropped, because those are the
        half somebody has to deal with by hand (PRD SE-08).

        Reading this changes nothing.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompensationPlan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    post:
      tags: [runs]
      operationId: abandonRun
      summary: End the run and undo what it left standing
      description: |
        The one thing that performs a compensation, and it is always a person's
        decision. A parked run is paused, not failed: compensating one
        automatically would undo work it was about to resume.

        Every undo crosses the Gate on the narrow rule that you may undo what
        you were allowed to do. The run ends failed, never finished — an
        abandoned run did not complete, and the trail must not say it did.
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AbandonRequest' }
      responses:
        '200':
          description: The run ended, with what became of each undo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompensationResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The run has already ended.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /approvals:
    get:
      tags: [approvals]
      operationId: listApprovals
      summary: The approval inbox
      parameters:
        - $ref: '#/components/parameters/CompanyScope'
        - $ref: '#/components/parameters/Area'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Pending approvals, oldest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalPage' }

  /runs/{runId}/approvals:
    post:
      tags: [approvals]
      operationId: decideApproval
      summary: Approve or reject a suspended action
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalDecision' }
      responses:
        '200':
          description: The decision was recorded and the run resumed or ended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The run has no pending approval, or it already expired.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /cost:
    get:
      tags: [cost]
      operationId: getCostRollup
      summary: Consumption rolled up over a period
      description: |
        The run is the accounting unit; company, area and agent are dimensions
        derived from it. Totals always reconcile because they are projections
        of the same ledger rows.
      parameters:
        - $ref: '#/components/parameters/CompanyScope'
        - $ref: '#/components/parameters/Area'
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: groupBy
          in: query
          schema:
            type: string
            enum: [company, area, agent, day]
            default: agent
      responses:
        '200':
          description: The rollup.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostRollup' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /cost/planning/models:
    get:
      tags: [cost]
      operationId: getPlanningSpendByModel
      summary: Planning spend by effective model
      description: |
        One bucket per provider and model actually used by planning calls.
        The projection is forward-only: older ledger steps did not name the
        effective model, so the response names when this rollup starts making
        claims rather than estimating the past.
      parameters:
        - $ref: '#/components/parameters/CompanyScope'
        - $ref: '#/components/parameters/Area'
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: The model rollup.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanningSpendRollup' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /cost/planning/agents:
    get:
      tags: [cost]
      operationId: getPlanningSpendByAgent
      summary: Planning spend by agent
      description: |
        One bucket per agent. This cut deliberately does not name a provider or
        model: an agent can use more than one model across planning calls, and
        carrying one would be an arbitrary row from a folded bucket.
      parameters:
        - $ref: '#/components/parameters/CompanyScope'
        - $ref: '#/components/parameters/Area'
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: The agent rollup.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanningSpendRollup' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /audit:
    get:
      tags: [audit]
      operationId: listAudit
      summary: What happened, across both records that keep it
      description: |
        The platform keeps two append-only trails and they are not the same
        kind of thing. The run ledger is hash-chained: every step seals the one
        before it, so an altered step can be detected. The administrative trail
        records what people changed about the rules agents run under, and it is
        append-only by grant — nobody holds UPDATE — but it is not chained.

        Every entry says which record it came from and carries a seal only
        where one exists. A screen that merged them and called the result
        verified would claim a guarantee half its rows do not have.

        Scoped like every other read. An audit trail that showed an area
        somebody cannot otherwise see would be a way around every other check.
      parameters:
        - $ref: '#/components/parameters/CompanyScope'
        - $ref: '#/components/parameters/Area'
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
        - name: actor
          in: query
          description: One person or agent.
          schema: { type: string }
        - name: source
          in: query
          description: Narrow to one record. Both when absent.
          schema: { type: string, enum: [ledger, admin] }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: |
            A page of the trail, newest first. Walk `nextCursor` and you have
            walked the whole trail, each entry once — which is what an auditor
            needs and what a bare limit cannot give.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /policies:
    get:
      tags: [policies]
      operationId: listPolicies
      summary: The rules in force
      description: |
        Every authored policy, with how many times each one decided something
        in the period. Readable by anybody a policy constrains — an author who
        cannot see the rule that stopped their agent cannot act on it — and
        writable only with policy:write, because a rule somebody constrained
        can edit is that person's rule rather than the organisation's.
      parameters:
        - name: since
          in: query
          description: Count decisions from this instant. Defaults to seven days ago.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: The policies, and the hash naming the set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /policies/simulate:
    post:
      tags: [policies]
      operationId: simulatePolicy
      summary: What a draft rule would have done
      description: |
        Replays a rule that has not been saved against decisions already
        recorded, so a policy is never saved blind.

        A rule that reads `args.*` cannot be replayed against every decision:
        a blocked call never stored arguments, so for those the answer is not
        "no match" but "unknown", and it is reported separately. Counting them
        as no-matches would show zero denials for exactly the rule somebody was
        nervous about.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyInput' }
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: What the rule would have done.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Simulation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /policies/{code}:
    put:
      tags: [policies]
      operationId: putPolicy
      summary: Write a policy
      description: |
        Creating and editing are the same call: the code is the identity, set
        once and never changed, because it appears in the trail and in the
        message somebody denied reads.

        Every write takes a snapshot of the whole set in the same transaction,
        so the hash recorded on decisions from this moment names rules that can
        be fetched back.
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyInput' }
      responses:
        '200':
          description: The policy as stored, and the new set hash.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyWritten' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

    delete:
      tags: [policies]
      operationId: deletePolicy
      summary: Remove a policy
      description: |
        The rule stops being evaluated. Decisions it already made keep pointing
        at the snapshot that held it, so removing a policy never rewrites what
        it did.
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/tools:
    get:
      tags: [admin]
      operationId: listTools
      summary: Every tool the platform knows, and what it is classified as
      description: >
        Tools arrive from their servers unclassified whatever the server claims
        about itself, and an unclassified tool is refused at run time. Saying
        what one does is a separate, recorded act.

        Where the platform already knows the server, each tool carries a
        suggestion with its reasoning, so that act is a confirmation rather
        than forty rulings invented from a list of bare names. A suggestion is
        never a classification.
      responses:
        '200':
          description: The tool catalogue.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Tool' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/tools/{toolId}/classification:
    put:
      tags: [admin]
      operationId: classifyTool
      summary: Record what a tool does to the world
      description: >
        The single point where write access enters the platform. The ruling is
        durable and attributed; the previous one is not amended, it is
        superseded, and both stay in the administrative trail.
      parameters:
        - name: toolId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [effect]
              properties:
                effect: { $ref: '#/components/schemas/Effect' }
                untrusted:
                  type: boolean
                  description: Whether results carry data the platform did not author. Reading one taints the run.
                reason: { type: string }
                compensatedBy:
                  type: string
                  description: |
                    The tool that takes an act by this one back, called with
                    what the original call returned. Empty means an act by this
                    tool cannot be undone by machine — which abandoning a run
                    reports rather than hides.
                dedupe:
                  $ref: '#/components/schemas/ToolDedupe'
                digest:
                  type: string
                  description: |
                    The definition being judged, as the screen showed it.

                    Sent by the client rather than stamped by the server, for
                    the reason an approval carries the step it approved: the
                    Curator read a description and a schema, and if the server
                    changed them while the dialog was open, stamping whatever
                    is current would record a judgement of something nobody
                    read. Refused when it no longer matches, so they look
                    again.

                    Omit only when ruling on a tool whose definition is not
                    known — the ruling then applies until a definition is.
      responses:
        '204': { description: The ruling is recorded. }
        '409':
          description: The definition changed since the screen showed it.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /budgets/alerts:
    get:
      tags: [cost]
      operationId: listBudgetAlerts
      summary: Which scopes have crossed a budget threshold
      description: |
        Half, four fifths, and all of it (PRD FO-05). One entry per scope,
        naming the highest threshold it has reached in the current period —
        a scope at 85% is reported once, at 80, rather than twice.

        An empty list means nothing has crossed 50% this period.
      parameters:
        - $ref: '#/components/parameters/CompanyScope'
        - $ref: '#/components/parameters/Area'
      responses:
        '200':
          description: The crossings in force.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/BudgetAlert' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/stops:
    get:
      tags: [admin]
      operationId: listStops
      summary: What is currently stopped
      description: |
        The switches that are off, widest first. An empty list is the normal
        state: nothing is stopped (PRD FO-06).
      responses:
        '200':
          description: The switches in force.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Stop' }
        '401': { $ref: '#/components/responses/Unauthorized' }

    put:
      tags: [admin]
      operationId: setStop
      summary: Stop or start a level of the platform
      description: |
        Three levels, from the narrow to the total: one agent, everything in a
        scope, and the whole installation. An incident does not arrive scoped
        to the agent somebody happens to be looking at.

        Stopping takes effect on the next trigger of any kind — schedule,
        webhook, event or the console's own button — because every way a run
        can start goes through one place. Runs already in flight are not
        touched: stopping is not undoing, and a run that has already acted on
        the world is ended deliberately, with its compensation, from the run
        itself.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StopRequest' }
      responses:
        '204': { description: The switch is set. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/integrations:
    get:
      tags: [admin]
      operationId: listIntegrations
      summary: Everything the platform is configured to talk to
      description: >
        Tool servers and model providers. Credentials are never returned; a
        provider only reports whether one is stored.
      responses:
        '200':
          description: The configured integrations.
          content:
            application/json:
              schema:
                type: object
                required: [mcpServers, providers]
                properties:
                  presets:
                    type: array
                    description: |
                      The providers the platform already knows how to reach.
                      Choosing one fills in its endpoint, so an operator supplies
                      an address only when it is a proxy or a self-hosted model.
                    items: { $ref: '#/components/schemas/ModelPreset' }
                  mcpServers:
                    type: array
                    items: { $ref: '#/components/schemas/MCPServer' }
                  providers:
                    type: array
                    items: { $ref: '#/components/schemas/ModelProvider' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /integrations/mcp-credentials:
    get:
      tags: [integrations]
      operationId: listMCPUserCredentials
      summary: The caller's own MCP credentials
      description: |
        Lists only whether the signed-in user has supplied a credential for
        each remote MCP server. The credential itself never leaves the vault.

        This is not administrative configuration: it does not connect a server,
        widen the tool surface, or classify an effect. It lets a run carrying
        this user's delegation call a remote server as that user instead of as
        the installation.
      responses:
        '200':
          description: The caller's MCP credential presence.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MCPUserCredential' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /integrations/mcp-credentials/{name}:
    put:
      tags: [integrations]
      operationId: putMCPUserCredential
      summary: Store the caller's credential for one remote MCP server
      description: |
        Stores a credential owned by the signed-in user, for a configured HTTP
        MCP server. The worker reads it only when a run carries that user's
        OnBehalfOf; discovery and health checks still use the server's shared
        credential, if any.
      parameters:
        - name: name
          in: path
          required: true
          description: The configured MCP server name.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MCPUserCredentialInput' }
      responses:
        '204': { description: Stored. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [integrations]
      operationId: deleteMCPUserCredential
      summary: Remove the caller's credential for one MCP server
      parameters:
        - name: name
          in: path
          required: true
          description: The configured MCP server name.
          schema: { type: string }
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/people:
    get:
      tags: [admin]
      operationId: listPeople
      summary: Everybody the installation knows about
      description: |
        With what each one holds, and where each grant came from. A grant an
        identity provider asserts is re-derived on every sign-in, so it is
        marked: revoking one here would last until its holder signs in again,
        and the group is the thing to change.

        Somebody with no grant at all is listed rather than hidden. They can
        sign in and do nothing, which is exactly who an operator opens this
        screen looking for.
      responses:
        '200':
          description: The people.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Person' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/people/local:
    post:
      tags: [admin]
      operationId: createLocalPerson
      summary: An account that does not need an identity provider
      description: |
        Beside the provider, never instead of it. Where a customer has one,
        the provider is how people arrive: joiners and leavers are handled
        where they are already handled, and the console never sees a password.

        This is for the installation that has no provider yet, and for the
        small one that never will. The duties exist to hold an author and an
        approver apart, and an installation with a single account cannot show
        the separation it is sold on — before this, a fresh installation had
        exactly one account, the one the setup token created.

        The account arrives holding nothing. Granting is a separate act, on
        the screen that already does it, so creating somebody and deciding
        what they may do stay two entries in the trail.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  description: What they type to sign in. Compared without case.
                password: { type: string }
                display: { type: string }
                email: { type: string }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: That username is taken.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /admin/people/{principalId}/password:
    put:
      tags: [admin]
      operationId: setPassword
      summary: Set or replace a local password
      description: |
        Sessions already open are left alone: setting a password is
        ordinarily somebody setting one for the first time, and signing them
        out of the browser they are typing in would be a surprise. Revoking
        sessions is a separate act, and the one to reach for when a password
        leaked.
      parameters:
        - name: principalId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
                username:
                  type: string
                  description: >
                    Given when the account has no handle yet, which is the
                    case for the administrator the setup token created.
      responses:
        '204': { description: Stored. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: That username is taken.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /admin/people/{principalId}/grants:
    put:
      tags: [admin]
      operationId: setGrants
      summary: What this person may do, granted directly
      description: |
        Replaces the grants an operator set by hand and leaves every asserted
        one alone. The two writers are separate on purpose: an identity
        provider re-derives its own on every sign-in, and a console that
        overwrote them would hand back access somebody lost by leaving a team.
      parameters:
        - name: principalId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grants]
              properties:
                grants:
                  type: array
                  items: { $ref: '#/components/schemas/GrantInput' }
      responses:
        '204': { description: Stored. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/retention:
    get:
      tags: [admin]
      operationId: getRetention
      summary: How long this installation keeps content
      description: |
        Content, never the ledger. The trail is immutable and survives every
        erasure: what goes is the referenced payload, and the step keeps its
        reference and its digest, so the hash chain is untouched.
      responses:
        '200':
          description: The window in force.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Retention' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [admin]
      operationId: setRetention
      summary: Change how long content is kept
      description: |
        Shortening it destroys data on the next sweep, which runs daily. There
        is a floor of one day: this is the one setting where a typo cannot be
        undone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [days]
              properties:
                days: { type: integer, minimum: 1 }
      responses:
        '204': { description: Stored. It takes effect on the next sweep. }
        '400':
          description: A window shorter than a day.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/branding:
    get:
      tags: [admin]
      operationId: getAdminBranding
      summary: Installation branding as configured
      description: |
        The same shape as `/branding`, behind administration so the console can
        show this beside the rest of the installation settings and record who
        changes it.
      responses:
        '200':
          description: The branding in force.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Branding' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [admin]
      operationId: setAdminBranding
      summary: Change the installation brand
      description: |
        Stores display name, image URLs and the primary colour. Image content is
        referenced, not uploaded: binary asset storage is a separate concern and
        a URL keeps this setting auditable like the rest of administration.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Branding' }
      responses:
        '204': { description: Stored. New pages apply it immediately. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /audit/export:
    get:
      tags: [audit]
      operationId: exportLedger
      summary: A signed range of the ledger
      description: |
        Checkable by somebody who does not trust this installation. Two
        mechanisms have to hold: the hash chain proves the content — editing a
        payload, reordering two steps or removing one from the middle all break
        a link — and the signature proves the range came from here.

        `agentd verify <file>` checks both, and needs no database, no
        credential and no network. An export somebody has to ask us about is an
        export they are trusting us for.
      parameters:
        - name: runId
          in: query
          description: One run. Ranges by time come later; a run is the unit an auditor asks about.
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The signed bundle.
          content:
            application/json:
              schema:
                type: object
                description: A ledger export. Its shape is the `format` field's contract, not this one's.
                additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /audit/signing-key:
    get:
      tags: [audit]
      operationId: getSigningKey
      summary: The key this installation signs exports with
      description: |
        The public half, which is not a secret: publishing it is what lets
        somebody check an export without asking us anything. The fingerprint is
        short enough to read out loud, which is how it is usually compared.
      responses:
        '200':
          description: The public key.
          content:
            application/json:
              schema:
                type: object
                required: [publicKey, fingerprint]
                properties:
                  publicKey: { type: string, description: Base64, Ed25519. }
                  fingerprint: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/erasures:
    post:
      tags: [admin]
      operationId: eraseContent
      summary: Erase what a set of runs was about
      description: |
        Per-subject erasure (NF-09). The runs are named by the caller: nothing
        here indexes content by the person it concerns, deliberately, because
        an index of who appears in what would be the very record a subject is
        asking to be rid of.

        The runs themselves remain, and so does their trail. What goes is the
        content they point at, which is where personal data lives.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [runs, reason]
              properties:
                runs:
                  type: array
                  minItems: 1
                  items: { type: string }
                reason:
                  type: string
                  description: Recorded in the trail. An erasure nobody can account for is indistinguishable from data loss.
      responses:
        '200':
          description: What was erased.
          content:
            application/json:
              schema:
                type: object
                required: [objects]
                properties:
                  objects: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/identity-providers:
    get:
      tags: [admin]
      operationId: listIdentityProviders
      summary: How people sign in, and what signing in grants them
      description: |
        Authenticating and being allowed to do something are separate. A
        provider proves who somebody is; its group mappings decide what that
        makes them, and a provider with no mapping grants nothing however
        successfully somebody signs in — which is the correct default.

        Client secrets are never returned. The listing says one is stored.
      responses:
        '200':
          description: The configured providers.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/IdentityProvider' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/identity-providers/{id}:
    put:
      tags: [admin]
      operationId: putIdentityProvider
      summary: Configure a way of signing in
      description: |
        The issuer is discovered as this is saved, so a wrong address is an
        error the operator sees now rather than a sign-in that fails later for
        somebody else.

        An omitted client secret keeps the stored one. Fixing a group mapping
        must not demand re-entering a credential nobody has to hand — the
        alternative is a mapping left wrong because correcting it cost too
        much.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdentityProviderInput' }
      responses:
        '204': { description: Stored, discovered and live. }
        '400':
          description: |
            The provider could not be discovered, or is missing something it
            cannot work without.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [admin]
      operationId: deleteIdentityProvider
      summary: Remove a way of signing in
      description: |
        It stops accepting sign-ins immediately. Sessions already issued are
        unaffected: revoking those is a separate act, because removing a
        misconfigured provider should not sign out the person fixing it.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/integrations/recipes:
    get:
      tags: [admin]
      operationId: listRecipes
      summary: Tool servers this platform knows about
      description: >
        What the platform has read about servers other people publish: who
        publishes one, where it is documented, how it is usually reached, and
        the credential it expects.

        A recipe fills the connection form and decides nothing. It is not a
        supported connector, not a hosted service and not an endorsement — this
        platform did not write these servers and vouches for nothing beyond
        saying where it read what it read. Its suggestions about what a tool
        does are proposals a Curator confirms, never classifications.
      responses:
        '200':
          description: What is known.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ServerRecipe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/integrations/connectors/catalog:
    get:
      tags: [admin]
      operationId: listConnectorCatalog
      summary: Governed connector shapes this platform can host
      description: >
        Native connector shapes the platform governs directly. Listing a
        connector here creates no credential and starts no worker; executable
        tools exist only for configured connector instances. The catalogue names
        the security contract every instance must satisfy before a call reaches
        the external system.
      responses:
        '200':
          description: The governed connector catalogue.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/GovernedConnector' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/integrations/connectors/instances:
    get:
      tags: [admin]
      operationId: listConnectorInstances
      summary: Configured governed connector instances
      description: >
        Connector instances are the executable endpoints behind governed
        connector shapes. The response reports whether a token exists; the
        token itself never leaves the settings vault.
      responses:
        '200':
          description: The configured connector instances.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ConnectorInstance' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/integrations/connectors/instances/{name}:
    put:
      tags: [admin]
      operationId: putConnectorInstance
      summary: Configure a governed connector instance
      description: >
        Configuring an instance creates executable native tools named
        connector.instance.operation. Omit token to keep the stored one. Send
        clearToken to remove it; an enabled instance must still have a token
        after the write.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectorInstanceInput' }
      responses:
        '204': { description: The connector instance is configured. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [admin]
      operationId: deleteConnectorInstance
      summary: Remove a governed connector instance
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: scopeKind
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ConnectorScopeKind' }
        - name: company
          in: query
          schema: { type: string }
        - name: area
          in: query
          schema: { type: string }
      responses:
        '204': { description: The connector instance is removed. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/integrations/mcp-servers/{name}:
    put:
      tags: [admin]
      operationId: putMCPServer
      summary: Configure a tool server
      description: >
        Adding a server changes what agents can do, so it is recorded like any
        other administrative change. The tools it offers arrive unclassified
        and do nothing until somebody says what they do; that stays a separate
        act.
      parameters:
        - name: name
          in: path
          required: true
          description: Namespaces the tools this server offers.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                transport:
                  allOf: [{ $ref: '#/components/schemas/Transport' }]
                  default: stdio
                command:
                  type: string
                  description: Required for stdio.
                args:
                  type: array
                  items: { type: string }
                url:
                  type: string
                  description: Required for http.
                protocolMode:
                  allOf: [{ $ref: '#/components/schemas/MCPProtocolMode' }]
                  description: >
                    How the HTTP MCP protocol is negotiated. Omit to use auto.
                    Legacy exists for endpoints that reject the current
                    server/discover probe.
                token:
                  type: string
                  description: >
                    Bearer token for a remote server. Omit to keep the stored
                    one — correcting a URL must not demand re-entering a secret
                    nobody has to hand.
                headers:
                  type: object
                  additionalProperties: { type: string }
                  description: >
                    Exact HTTP headers for a remote server whose credential is
                    not a bearer token, such as Api-Key or Authorization:
                    Basic. Omit to keep stored headers. Send an empty object
                    to remove them. A non-empty object becomes the active HTTP
                    credential and replaces stored bearer or OAuth material.
                oauth:
                  allOf: [{ $ref: '#/components/schemas/MCPOAuthGrant' }]
                  description: >
                    OAuth grant for a remote server. Omit to keep the stored
                    grant. Send an empty object to clear it. A non-empty grant
                    becomes the active HTTP credential and replaces a stored
                    bearer token.
                env:
                  type: object
                  additionalProperties: { type: string }
                  description: >
                    Variables handed to a local server, and only to one. A
                    program started inside the worker no longer inherits the
                    worker's environment, so this is how it receives the
                    credential it needs — explicitly, per server, from the
                    vault.

                    Sealed like the token, because the reason a server needs a
                    variable is nearly always that the variable is a key, and a
                    field that is sometimes a secret is stored as one always.

                    Omit to keep what is stored. Send an empty object to clear
                    it: not sending something and sending nothing are different
                    requests, and only one of them can be an erasure.
                configFile:
                  type: string
                  description: >
                    Configuration content to seal and materialise as a file for
                    a local server. Omit to keep the stored file. Send an empty
                    string to remove it.
                configFileEnv:
                  type: string
                  description: >
                    Environment variable that receives the managed file path.
                    Omit to keep the stored variable; send an empty string to
                    use the platform default. Meaningless for http.
                surface:
                  type: array
                  items: { type: string }
                  description: >
                    Which of the server's tools to bring in, by the names the
                    server uses. Omit to leave the choice as it stands, which
                    for a server nobody has chosen one for means everything it
                    offers. Send an empty array to bring in nothing.
                rateLimit:
                  allOf: [{ $ref: '#/components/schemas/MCPRateLimit' }]
                  description: >
                    Per-worker token bucket for outgoing tool calls to this
                    server. Omit to leave the choice as it stands. Send both
                    fields as zero to disable it.
                cache:
                  allOf: [{ $ref: '#/components/schemas/MCPResultCache' }]
                  description: >
                    Per-worker in-memory cache for successful read-only tool
                    results from this server. Omit to leave the choice as it
                    stands. Send both fields as zero to disable it.
                stdioEgress:
                  allOf: [{ $ref: '#/components/schemas/MCPStdioEgress' }]
                  description: >
                    Egress request for a local stdio process. Omit to leave the
                    stored choice as it stands. Send mode inherit to clear it.
                    Send mode proxied with destinations to require a worker
                    egress proxy before the process starts. The proxy
                    environment is not, by itself, network containment; a
                    deployment-level egress policy is still the enforcement
                    boundary.
                acceptsLocalExecution:
                  type: boolean
                  description: >
                    Required for stdio, and refused without it. A local server
                    is a program this installation starts inside the worker,
                    running as the worker and reaching whatever the worker can
                    reach. That is a decision a person makes, not one a
                    transport implies, and it is recorded with their name.
                enabled: { type: boolean, default: true }
      responses:
        '204': { description: The server is configured. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [admin]
      operationId: deleteMCPServer
      summary: Remove a tool server
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: The server is removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/integrations/mcp-servers/{name}/probe:
    post:
      tags: [admin]
      operationId: probeMCPServer
      summary: Ask a worker to reach a tool server now
      description: >
        Records an explicit connection test for a configured server. The API
        process does not connect to MCP servers itself: for stdio that would
        start code in the API pod instead of in the worker that offers tools
        to agents. A worker consumes this request and records the same health
        observation ordinary reconciliation writes.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '202': { description: The probe was queued for a worker. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/companies:
    get:
      tags: [admin]
      operationId: listCompanies
      summary: The companies this installation governs
      description: |
        Every one, withdrawn ones included: their runs stay readable and
        somebody looking at those has to be able to find out what that company
        was. A withdrawn one says so rather than being hidden.

        This is the administrative listing and needs authority over the
        installation. The list a person actually chooses a context from comes
        from their own grants, on `/me`, and shows only what they reach.
      responses:
        '200':
          description: The companies.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Company' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      operationId: createCompany
      summary: Register a company
      description: |
        Creating one grants the caller inside it, in the same act. Every
        listing here is filtered by the scopes somebody holds, so a company
        created without a grant would report success and then show nothing.

        Authority over the installation, never over a company: held inside one,
        this would let that company's administrator mint another and grant
        themselves in it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
                  description: >
                    Lowercase letters, digits and hyphens. It reaches a URL, a
                    settings key and every scope written as "company/area", and
                    it never changes.
                label:
                  type: string
                  description: What people read. This does change.
      responses:
        '201':
          description: The company, and the grant that came with it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: That identifier is taken.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /admin/companies/{company}:
    patch:
      tags: [admin]
      operationId: updateCompany
      summary: Rename a company, or withdraw it
      description: |
        Withdrawing archives and never deletes. The runs, decisions and trail
        name the company, and removing it would leave every one of them
        pointing at nothing.
      parameters:
        - name: company
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
                archived:
                  type: boolean
                  description: >
                    True withdraws it from what is offered for new work; false
                    puts it back.
      responses:
        '204': { description: The company is changed. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/channels:
    get:
      tags: [admin]
      operationId: listChannels
      summary: Where runs report, and to whom
      description: |
        The connections this installation can post through, and the
        conversations mapped onto scopes inside them.

        A channel is where runs report, and — when inbound delivery is
        configured — where a deliberate mention can ask an agent to start.
        The two halves share one connection but not one secret: posting uses
        the bot token, HTTP inbound uses the signing secret, and Socket Mode
        uses an app-level token (NT-005 stage 1 and stage 3).
      responses:
        '200':
          description: The channels, with their conversations.
          content:
            application/json:
              schema:
                type: object
                required: [items, kinds]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Channel' }
                  kinds:
                    type: array
                    description: >
                      The vendors this installation can connect. Answered by
                      the binary rather than assumed by the console, so a
                      screen can never offer a kind the process cannot build.
                    items: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/channels/{name}:
    put:
      tags: [admin]
      operationId: putChannel
      summary: Configure a channel connection
      parameters:
        - name: name
          in: path
          required: true
          description: Names the connection, not the vendor. Conversations refer to it.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [slack] }
                workspace:
                  type: string
                  description: What a person calls it. Never used to address anything.
                deliveryMode:
                  type: string
                  enum: [http, socket]
                  default: http
                  description: |
                    How Slack asks reach this installation.

                    `http` means Slack calls this installation's Request URL
                    and the signing secret verifies each request. `socket`
                    means a worker opens Slack Socket Mode outbound with an
                    app-level token, so no public callback URL is required for
                    Events API payloads.
                token:
                  type: string
                  description: >
                    The bot credential, sealed by the vault. Omit to keep the
                    stored one — renaming a workspace must not demand
                    re-entering a secret nobody has to hand.
                appToken:
                  type: string
                  description: |
                    Slack app-level token (`xapp-...`) used to open Socket
                    Mode. Omit to keep the stored one. It is not the bot token:
                    it cannot post messages, and it exists only so the worker
                    can receive Events API payloads over an outbound WebSocket.
                signingSecret:
                  type: string
                  description: |
                    What arriving requests are checked against, sealed beside
                    the token. Not the same secret and not interchangeable: the
                    token is a bearer this installation sends, this is what it
                    verifies with, and HMAC needs the secret itself — a hash
                    cannot produce one.

                    Absent leaves the inbound surface closed, which is the safe
                    reading of a channel nobody has switched it on for.
                enabled: { type: boolean, default: true }
      responses:
        '204': { description: The channel is configured. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [admin]
      operationId: deleteChannel
      summary: Remove a channel connection
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: The channel is removed, with its conversations. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/channels/{name}/available:
    get:
      tags: [admin]
      operationId: listAvailableConversations
      summary: The conversations this connection can be pointed at
      description: |
        Only the ones the bot is already a member of. A picker built on this
        cannot offer a place where posting would fail, so the commonest mistake
        in configuring a channel — forgetting to invite the bot — stops being
        possible rather than being caught later by a notification that never
        arrived.

        Nobody should have to find `C0123ABCDEF`. What an operator knows is
        `#alertas`, so that is what they choose; the identifier is what gets
        stored, because a channel can be renamed and its id cannot.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: What the bot can post to.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        private: { type: boolean }
        '400':
          description: >
            The channel could not be asked — most often an app granted
            chat:write and not channels:read. The reason is the channel's own.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/channels/{name}/conversations/{conversation}:
    put:
      tags: [admin]
      operationId: putConversation
      summary: Point a scope's runs at a conversation
      description: |
        The scope is the governing part. A conversation receives the runs of
        the scope it is configured in and no others — a channel carrying
        another area's runs would be a way around every read check on this
        platform, arriving as a notification.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: conversation
          in: path
          required: true
          description: The conversation as the channel knows it, e.g. a Slack channel id.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company]
              properties:
                company: { type: string }
                area:
                  type: string
                  description: Empty covers the whole company.
                label:
                  type: string
                  description: What a person calls it, for the console and the logs.
                mode:
                  type: string
                  enum: [mentions, watch, both]
                  default: mentions
                  description: |
                    `mentions` starts only when a person mentions the channel
                    bot and names an agent. `watch` starts one configured
                    agent from ordinary messages written by configured
                    sources, under the configured principal. `both` keeps the
                    mention path and the watched-message path enabled together;
                    each keeps its own authority.
                sources:
                  type: array
                  description: |
                    Slack user, bot or app ids allowed to trigger watched
                    messages. They filter the source; they never grant
                    authority.
                  items: { type: string }
                agent:
                  type: string
                  description: The agent started by watched messages.
                runAs:
                  type: string
                  description: The platform principal watched messages run on behalf of.
                threadContext:
                  type: boolean
                  description: |
                    For modes that accept mentions. When a person mentions the
                    bot inside an existing Slack thread, include a bounded slice
                    of earlier thread messages in the run input. Those messages
                    remain untrusted input and require the Slack history scope
                    for the conversation type.
                wants:
                  type: array
                  description: >
                    Which events reach it. Empty means the defaults, which are
                    parked and failed — a conversation that hears every run
                    finish is one people mute.
                  items: { type: string, enum: [parked, failed, finished] }
                enabled: { type: boolean, default: true }
      responses:
        '204': { description: The conversation is configured. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [admin]
      operationId: deleteConversation
      summary: Stop reporting to a conversation
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: conversation
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: The conversation is removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/channels/{name}/identities/{account}:
    put:
      tags: [admin]
      operationId: bindChannelIdentity
      summary: Say who a channel account is
      description: |
        The most consequential thing configured here. Binding an account grants
        that person's authority — their grants, their permission to decide an
        approval — to whoever holds it, and nothing downstream can tell the
        difference: by the time a decision is being sealed, the principal is
        simply the principal.

        So it is explicit and it is recorded. There is no matching on email and
        no inferring from a display name: an account speaks for somebody
        because a person said so, and the trail says which person.

        An account nobody has bound acts as nobody at all.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: account
          in: path
          required: true
          description: >
            The identifier the channel knows a person by — a Slack user id, not
            their display name, which people change and two people can share.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [principal]
              properties:
                principal:
                  type: string
                  description: Who this account speaks for.
      responses:
        '204': { description: The account is bound. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [admin]
      operationId: unbindChannelIdentity
      summary: Withdraw a binding
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: account
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: The binding is withdrawn. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/channels/{name}/conversations/{conversation}/test:
    post:
      tags: [admin]
      operationId: testConversation
      summary: Prove the wiring, without waiting for a run
      description: |
        Posts one message saying what it is. Configuring a channel otherwise
        means waiting for a run to park to find out whether the bot was ever
        invited — and a notification that silently goes nowhere is the failure
        this whole stage exists to avoid.

        Recorded in the administrative trail like any other act that reaches
        outside this installation.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: conversation
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The message was delivered.
          content:
            application/json:
              schema:
                type: object
                required: [delivered]
                properties:
                  delivered: { type: boolean }
                  ref:
                    type: string
                    description: What the channel called the message.
        '400':
          description: The channel refused it, with its own reason.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/integrations/providers/{name}:
    put:
      tags: [admin]
      operationId: putModelProvider
      summary: Configure a model provider
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind:
                  type: string
                  enum: [anthropic, openai_compatible]
                baseUrl:
                  type: string
                  description: |
                    Required for openai_compatible and refused as empty there,
                    because only the installation knows where its endpoint is.
                    Omitted for anthropic, whose client already knows one.
                apiKey:
                  type: string
                  description: >
                    Sealed in the vault on arrival and never returned. Omit it
                    to keep the stored credential — changing a base URL should
                    not require re-entering a key.
                enabled: { type: boolean, default: true }
      responses:
        '204': { description: The provider is configured. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [admin]
      operationId: deleteModelProvider
      summary: Remove a model provider
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: The provider is removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/budgets:
    get:
      tags: [admin]
      operationId: listBudgets
      summary: The ceilings configured per scope
      description: >
        A scope ceiling is a limit over a window, distinct from the per-run
        ceiling in an agent's specification. Both are enforced by the same
        check; a run is bounded by whichever binds first.
      responses:
        '200':
          description: Configured ceilings.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ScopeBudget' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/budgets/{scope}:
    put:
      tags: [admin]
      operationId: putBudget
      summary: Set a scope's ceiling
      description: >
        Ceilings inherit downwards and never widen: an area cannot raise what
        its company allows. Reaching one pauses the run resumably rather than
        ending it, so raising the ceiling continues from the same step.
      parameters:
        - name: scope
          in: path
          required: true
          description: '`installation`, a company id, or `company/area`.'
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [period]
              properties:
                period:
                  type: string
                  enum: [daily, monthly]
                micros: { type: integer, format: int64 }
                tokens: { type: integer, format: int64 }
                toolCalls: { type: integer, format: int64 }
                steps: { type: integer, format: int64 }
                wallClockMs: { type: integer, format: int64 }
                enabled: { type: boolean, default: true }
      responses:
        '204': { description: The ceiling is set. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [admin]
      operationId: deleteBudget
      summary: Remove a scope's ceiling
      parameters:
        - name: scope
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: The ceiling is removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/authoring:
    get:
      tags: [admin]
      operationId: getAuthoring
      summary: The model the interview uses
      description: |
        Which connected provider writes the drafts when somebody authors an
        agent by answering questions instead of filling a form.

        A choice, not a second registry: the connection itself — endpoint,
        credential, health — stays in `/admin/integrations`, and this points
        into it. Two credential stores would be two places to leak from, two to
        rotate and two to audit, and an installation with one account would
        configure it twice.

        Disabled is a supported state. An installation with no strong model
        still publishes agents through the form; the interview is the good
        path rather than the only one.
      responses:
        '200':
          description: The choice in force, or a disabled one.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthoringChoice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [admin]
      operationId: setAuthoring
      summary: Point the interview at a provider
      description: |
        Refuses a provider `/admin/integrations` does not know. Without that
        check the two drift apart silently, and the failure surfaces as a call
        to an endpoint that does not exist — at the moment somebody is halfway
        through describing a process.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthoringChoice' }
      responses:
        '204': { description: The choice is recorded. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/prices:
    get:
      tags: [admin]
      operationId: listPrices
      summary: What this installation pays per model
      description: |
        Configured rates are the installation's contract override. Known
        models also return bundled market defaults as reference values, with
        their own currency named. Those defaults are not used for Cost.Micros:
        money in the ledger and in ceilings is always the installation's
        currency. Unknown models still record tokens and no money until an
        operator sets a rate.
      responses:
        '200':
          description: The rates configured.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ModelPrice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [admin]
      operationId: putPrice
      summary: Set a model's rate
      description: |
        The four rates stay separate: a cache read costs a fraction of an
        input token, and collapsing them is what makes an agent's cost
        impossible to diagnose (PRD FO-08).

        Takes effect for runs started after the workers reload. What is already
        in the ledger keeps the money it was recorded with — a past entry is
        not re-priced because a table changed today.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelPrice' }
      responses:
        '204': { description: The rate is set. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/prices/{provider}/{model}:
    delete:
      tags: [admin]
      operationId: deletePrice
      summary: Withdraw a model's rate
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string }
        - name: model
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: The rate is withdrawn. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/money:
    put:
      tags: [admin]
      operationId: setMoney
      summary: Set the installation currency
      description: |
        Names the currency Cost.Micros and Budget.Micros are interpreted in.
        This does not convert existing ledger rows or configured ceilings.
        It changes the unit readers attach to the integer, so installations
        should choose it before relying on money ceilings.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoneySettings' }
      responses:
        '204': { description: The currency is recorded. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/scopes:
    get:
      tags: [admin]
      operationId: listScopes
      summary: The areas that exist
      description: |
        An area is where work is filed: an agent belongs to one, a ceiling
        governs one, a policy can reach a set of them, and a grant is held in
        one. Before this list existed an area was whatever text somebody typed
        into an agent, so `financeiro` and `Financeiro` were two areas that
        never meet — a ceiling on one governs no agent under the other, and
        nothing reports it.

        Answers only with the areas inside the scopes the caller reaches, so
        the list doubles as what a context switcher may offer.
      responses:
        '200':
          description: The areas, ordered by company then id.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RegisteredScope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      operationId: registerScope
      summary: Register an area
      description: |
        The typed name is folded to a canonical id — lowercased, accents
        removed, spaces hyphenated — and the reply carries it, because the
        caller cannot know beforehand what "Risco de Crédito" becomes.
        Registering a name that folds onto an existing area relabels it rather
        than creating a second one.

        Behind scope:write, held only by the Curator: an area is where
        authority is granted, so anybody who could create one could create a
        place to hold authority nobody meant to give.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company, name]
              properties:
                company: { type: string }
                name:
                  type: string
                  description: As a person types it. Folded to an id server-side.
                label:
                  type: string
                  description: How it is shown. Defaults to the typed name.
      responses:
        '200':
          description: The area, with the id it was folded to.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisteredScope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/scopes/{scope}:
    delete:
      tags: [admin]
      operationId: deleteScope
      summary: Withdraw an area
      description: |
        Withdraws the area from the list offered for new work. It does not
        touch the agents, ceilings or policies already filed under it: those
        rows keep naming it and keep meaning what they meant. Withdrawing an
        area and rewriting history are different acts, and only the first is
        available here.
      parameters:
        - name: scope
          in: path
          required: true
          description: '`company/area`.'
          schema: { type: string }
      responses:
        '204': { description: The area is withdrawn. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/memory/assertions:
    get:
      tags: [admin]
      operationId: listMemoryAssertions
      summary: List governed memory assertions
      description: >
        Structured assertions agents may recall through the platform-owned
        memory tool. The response contains claims, counters and evidence
        references only; source content remains in the content store under its
        own retention and erasure rules.
      parameters:
        - $ref: '#/components/parameters/CompanyScope'
        - $ref: '#/components/parameters/Area'
        - name: agentId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/MemoryStatus' }
        - name: q
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Memory assertions visible to the caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryAssertionPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      operationId: createMemoryAssertion
      summary: Record or correct a governed memory assertion
      description: >
        Creates a new assertion or corrects the assertion with the same
        company, area, agent, kind, subject and signature. Labels are derived
        from the cited ledger evidence, never accepted from the client.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemoryAssertionInput' }
      responses:
        '200':
          description: The assertion now projected for recall.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryAssertion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            The write contradicts the memory that is already there: more than
            one row is this identity, the assertion it would correct is
            disabled or its source was erased, shared memory already answers
            it, or the evidence budget cannot hold a citation for every label
            the assertion carries. None of these is a bad request — the body
            was understood, and the state refused it.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /admin/memory/assertions/{assertionId}/disable:
    post:
      tags: [admin]
      operationId: disableMemoryAssertion
      summary: Disable a governed memory assertion
      description: >
        Disabling is another append-only memory event. The projected row stops
        being recalled, while the trail of who disabled it and why remains.
      parameters:
        - name: assertionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemoryDisableInput' }
      responses:
        '204': { description: The assertion is disabled. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/memory/match:
    post:
      tags: [admin]
      operationId: matchMemory
      summary: What the platform already holds for an identity
      description: >
        Asked while somebody is composing a memory, so they can see what they
        are about to duplicate. Keyed on the canonical identity, so a fact
        taught as "Grafana Datasource" answers somebody typing
        "grafana  datasource".

        Every state, including the ones recall will not return: an expired
        memory is why the fact looks unknown, and a disabled one says somebody
        decided against it. Shared memory is answered apart from the agent's
        own, because improving it is an act taken against the shared row.

        POST rather than GET: the subject and signature are what somebody typed
        into a memory, and a query string puts them in browser history, proxy
        logs and access logs. Nothing here writes, and it is not on the path a
        run takes to recall memory.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemoryMatchInput' }
      responses:
        '200':
          description: What is already here for this identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryMatch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            More than one row is this identity. Duplicates written before the
            canonical key existed cannot be told apart by a machine, and showing
            whichever sorted first would present half the problem as the whole
            of it.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /admin/memory/assertions/{assertionId}/reactivate:
    post:
      tags: [admin]
      operationId: reactivateMemoryAssertion
      summary: Bring a disabled memory assertion back
      description: >
        Reactivation is a new governance act, not the undoing of the disable.
        The server proves every citation against the ledger again before the
        assertion becomes recallable, sets a fresh expiry from this decision,
        and records an append-only memory event. A memory whose source run was
        erased never comes back.
      parameters:
        - name: assertionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemoryReactivateInput' }
      responses:
        '200':
          description: The assertion now projected for recall again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryAssertion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The memory is not one this decision can bring back: it is not
            disabled, its source run is gone, its citations no longer prove it,
            shared memory already answers the same identity, or somebody moved
            it while this was being decided.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /admin/memory/suggestions:
    get:
      tags: [admin]
      operationId: listMemorySuggestions
      summary: List governed memory suggestions
      description: >
        Structured assertions proposed by opted-in agents. They are not served
        by the memory tool until a person accepts them, or until the agent's
        versioned learning policy auto-confirms a repeated identical
        suggestion. The response contains counters and evidence references
        only; source content remains in the content store under retention and
        erasure.
      parameters:
        - $ref: '#/components/parameters/CompanyScope'
        - $ref: '#/components/parameters/Area'
        - name: agentId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/MemorySuggestionStatus' }
        - name: q
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Memory suggestions visible to the caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemorySuggestionPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/memory/suggestions/{suggestionId}/accept:
    post:
      tags: [admin]
      operationId: acceptMemorySuggestion
      summary: Promote a memory suggestion to active memory
      description: >
        Accepting a suggestion is a human governance act. The server derives
        labels from the suggestion itself and records an append-only memory
        event before projecting the active assertion.
      parameters:
        - name: suggestionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemorySuggestionAcceptInput' }
      responses:
        '200':
          description: The accepted assertion now projected for recall.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryAssertion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The memory the suggestion would become refuses the write: more than
            one row is this identity, the assertion is disabled or its source
            was erased, or the evidence budget cannot hold a citation for every
            label. The proposal is left pending — nothing was consumed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /admin/memory/suggestions/{suggestionId}/dismiss:
    post:
      tags: [admin]
      operationId: dismissMemorySuggestion
      summary: Dismiss a memory suggestion
      description: >
        Dismissing keeps the suggestion out of active memory and records who
        reviewed it. The underlying evidence stays governed by the content
        store's own retention and erasure rules.
      parameters:
        - name: suggestionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemorySuggestionReviewInput' }
      responses:
        '204': { description: The suggestion is dismissed. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/events:
    get:
      tags: [admin]
      operationId: listAdminEvents
      summary: What operators changed about the platform
      description: >
        The run ledger records what agents did; this records what people did to
        the rules agents run under. Append-only.
      parameters:
        - name: target
          in: query
          description: Read the trail backwards from one object.
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Administrative events, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminEventPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /healthz:
    get:
      tags: [system]
      operationId: health
      summary: Liveness probe
      description: |
        Whether this process is wedged. It touches nothing outside itself on
        purpose: a liveness probe that asked the database would restart every
        pod during a database blip, turning a recoverable outage into a crash
        loop across the installation.
      security: []
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /readyz:
    get:
      tags: [system]
      operationId: ready
      summary: Readiness probe
      description: |
        Whether this process can serve. Unlike liveness it does reach the
        database, because a process that cannot read the ledger has nothing to
        answer with — it should leave the load balancer's rotation, and it
        should not be restarted for it.

        Answers 503 with the reason rather than a bare failure, so `kubectl
        describe` shows what is wrong without anybody opening a shell.
      security: []
      responses:
        '200':
          description: Ready to serve.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Not ready.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A token minted by the platform after the user authenticates against the
        installation's identity provider. For agent-initiated calls the token
        carries an actor claim, so the trail records the agent acting on behalf
        of a human rather than the human alone.

  parameters:
    ManualLocale:
      name: locale
      in: query
      required: false
      description: |
        Which translation to read. An unknown locale falls back rather than
        failing: a reader whose browser asks for something the manual does not
        have should get the manual, not an error.
      schema:
        type: string
        enum: [pt-BR, en-US]

    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string }
    CompanyScope:
      name: company
      in: query
      description: Company scope. A single value until multi-company (PRD 3.1).
      schema: { type: string }
    Area:
      name: area
      in: query
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      description: |
        Opaque cursor from the previous page, taken verbatim from that page's
        `nextCursor`. It carries a position and no authority: the caller's
        scopes are applied to the resumed page exactly as they were to the one
        before it, so a cursor obtained under a wide grant reaches nothing
        under a narrow one.

        Absent starts at the most recent entry. A page that answers fewer rows
        than the limit is the last one and returns no cursor.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  responses:
    BadRequest:
      description: The request is malformed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Authenticated, but the caller does not hold the permission in this scope.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: No such resource, or it is outside the caller's scope.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    ManualIndex:
      type: object
      description: What the manual offers, in the locale that was asked for.
      required: [locale, pages]
      properties:
        locale:
          type: string
          description: The locale actually served, which may not be the one asked for.
        pages:
          type: array
          items: { $ref: '#/components/schemas/ManualEntry' }

    ManualEntry:
      type: object
      required: [slug, title, summary, section, tags, order, headings]
      properties:
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        section:
          type: string
          description: Stable section key. The console translates the label.
        tags:
          type: array
          items: { type: string }
        headings:
          type: array
          items: { $ref: '#/components/schemas/ManualHeading' }
        order: { type: integer }

    ManualHeading:
      type: object
      required: [id, title, level]
      properties:
        id: { type: string }
        title: { type: string }
        level: { type: integer }

    ManualPage:
      type: object
      description: |
        One page. `body` is Markdown; an internal link in it names another
        slug of this manual and never a path in the repository.
      required: [slug, title, summary, section, tags, order, headings, body]
      properties:
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        section:
          type: string
          description: Stable section key. The console translates the label.
        tags:
          type: array
          items: { type: string }
        headings:
          type: array
          items: { $ref: '#/components/schemas/ManualHeading' }
        order: { type: integer }
        body: { type: string }

    Branding:
      type: object
      description: |
        What this installation presents as itself. Empty URLs mean "use the
        built-in mark"; an empty primary colour means "use the built-in palette".
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        logoUrl:
          type: string
          maxLength: 4096
          description: Full wordmark or logo image. Empty falls back to the built-in wordmark.
        iconUrl:
          type: string
          maxLength: 4096
          description: Compact mark used in the collapsed sidebar. Empty falls back to the built-in mark.
        primaryColor:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: Hex colour applied to primary actions and the built-in mark. Empty falls back to Fuse Aqua.

    Problem:
      type: object
      description: |
        RFC 9457 problem detail.

        `type` carries a stable code — `fuseone:invalid-classification` — and is
        the field a client should branch on. It is what makes this refusal
        readable by a caller that is not the console and by a console in a
        language this server does not hold: the server names the condition, the
        reader chooses the words.

        `title` is a fallback for a client that knows no codes, in English. It
        is not translated and must not be parsed.

        `detail` carries the particulars — an identifier, a permission, a scope
        — so a client can render its own sentence around them.
      required: [title, status]
      properties:
        type:
          type: string
          default: about:blank
          description: A stable `fuseone:` code, or about:blank when there is none.
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }

    Phase:
      type: string
      enum: [unstarted, running, awaiting_approval, awaiting_tool, parked, compensating, finished, failed]

    Verdict:
      type: string
      enum: [allow, constrain, require_approval, block, duplicate]

    Effect:
      type: string
      description: >
        What a tool does to the world, as a caller asserts it. `unknown` is
        deliberately absent here: it is the zero value that makes an
        unclassified tool fail closed, and nobody may claim it.
      enum: [read, write, destructive, financial]

    ToolDedupe:
      type: object
      required: [windowSeconds, argPaths]
      description: |
        The Curator's declaration of what makes two effectful calls the same
        external act across runs. Company, area, agent and tool are
        platform-owned key prefixes; this object names only stable fields
        inside the proposed arguments. It is not a result cache.
      properties:
        windowSeconds:
          type: integer
          minimum: 1
          maximum: 31536000
          description: How long a confirmed effect suppresses the same semantic call.
        argPaths:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: string
            pattern: '^[A-Za-z_][A-Za-z0-9_-]*(?:\.[A-Za-z_][A-Za-z0-9_-]*)*$'
          description: Stable dotted argument paths that identify the external act.

    ToolSuggestion:
      type: object
      description: |
        What the platform ships about a server it already knows, so the Curator
        confirms instead of inventing forty rulings from a list of bare names.

        It is not a classification and never becomes one on its own. Applied on
        import it would put the decision back in a table shipped in a binary,
        which is the same mistake as trusting the server about itself, one step
        further away and harder to see.

        `why` is required. A suggested classification with no reasoning is a
        number to click past, and clicking past is precisely the failure a
        suggestion invites: it looks like work somebody already did.
      required: [effect, why]
      properties:
        effect: { $ref: '#/components/schemas/Effect' }
        untrusted: { type: boolean }
        compensatedBy: { type: string }
        why: { type: string }

    ToolEffect:
      type: string
      description: >
        What a tool does to the world, as a reader sees it — the same values
        and `unknown` besides, because a tool nobody has ruled on is a state
        this platform has and a screen has to be able to show.

        Two schemas rather than one with a note, because the direction is the
        whole difference: a reader must be able to see "nobody has said", and a
        caller must never be able to write it. Collapsed into one enum, the API
        would either emit a value outside its own schema — which it did — or
        offer `unknown` as something to assert.
      enum: [unknown, read, write, destructive, financial]

    StepKind:
      type: string
      enum:
        - run_started
        - planned
        - gate_decided
        - budget_reserved
        - tool_called
        - tool_returned
        - budget_reconciled
        - approval_requested
        - approval_decided
        - resumed
        - abandoned
        - compensated
        - failed
        - parked
        - run_finished

    Scope:
      type: object
      required: [company, area]
      properties:
        company: { type: string }
        area: { type: string }

    MemoryStatus:
      type: string
      enum: [active, disabled, expired, source_erased]

    MemorySuggestionStatus:
      type: string
      enum: [pending, accepted, dismissed, auto_confirmed, source_erased]

    MemoryLearningMode:
      type: string
      enum: [off, review, auto_confirm]

    MemoryLearningPolicy:
      type: object
      description: >
        Versioned opt-in for agent-proposed memory. Review mode records
        suggestions for a person. Auto-confirm mode only promotes an assertion
        after the same structured suggestion has been observed repeatedly.
      properties:
        mode:
          $ref: '#/components/schemas/MemoryLearningMode'
        minObservations:
          type: integer
          format: int64
          minimum: 2
          maximum: 8
          description: Required identical observations before auto-confirming.
        ttlDays:
          type: integer
          minimum: 1
          maximum: 365
          description: How long an auto-confirmed assertion remains active.

    MemoryEvidence:
      type: object
      required: [runId, artifact, digest]
      properties:
        runId: { type: string }
        artifact:
          type: string
          description: The platform-authored artifact name shown in the trail.
        digest:
          type: string
          description: Digest of the cited artifact as recorded with the evidence.

    MemoryAssertion:
      type: object
      description: >
        A structured remembered fact. The claim is small text for the model;
        evidence points back to ledger/content records, and labels tell the
        Gate what trust boundary the remembered fact carries.
      required:
        - id
        - scope
        - agentId
        - kind
        - subject
        - signature
        - claim
        - evidence
        - observations
        - confirmed
        - labels
        - status
        - createdBy
        - createdAt
        - updatedBy
        - updatedAt
      properties:
        id: { type: string }
        scope: { $ref: '#/components/schemas/Scope' }
        agentId: { type: string }
        kind: { type: string }
        subject: { type: string }
        signature: { type: string }
        claim: { type: string }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/MemoryEvidence' }
        observations: { type: integer, format: int64 }
        confirmed: { type: integer, format: int64 }
        labels:
          type: array
          items: { type: string }
        status: { $ref: '#/components/schemas/MemoryStatus' }
        expiresAt: { type: string, format: date-time, nullable: true }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }

    MemoryAssertionInput:
      type: object
      description: >
        A human-curated memory assertion, in the fields a person can answer.
        Kind and signature are derived as `fact` and the trimmed subject for a
        new assertion. They remain optional inputs only so an existing
        assertion with a legacy identity can be corrected without silently
        becoming a different memory; the server refuses both fields unless
        that identity already exists. Labels, the agent, the counters and the
        expiry are all absent on purpose: the server derives them from the run
        the evidence names and from policy, because every one of them changes
        what the memory means and none of them is something a caller should be
        able to assert about itself.
      required: [company, area, namespace, subject, claim, evidence, reason]
      properties:
        company: { type: string }
        area: { type: string }
        namespace:
          type: string
          enum: [agent, shared]
          description: >
            Who reads this memory. `agent` is the agent whose run the evidence
            names; `shared` is every agent in the scope. An explicit choice
            rather than an omitted field, because shared memory is what every
            agent reads and nobody should reach it by leaving something blank.
        kind:
          type: string
          deprecated: true
          description: >
            Existing identity kind when correcting a legacy assertion. Omit
            together with signature when teaching a new memory. Refused when
            no assertion already carries that identity.
        subject:
          type: string
          description: >
            Stable, specific name of the fact. New human and agent teaching use
            it as the signature, so different facts require different subjects.
        signature:
          type: string
          deprecated: true
          description: >
            Existing identity signature when correcting a legacy assertion.
            Omit together with kind when teaching a new memory. Refused when
            no assertion already carries that identity.
        claim: { type: string, maxLength: 1200 }
        evidence:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: '#/components/schemas/MemoryEvidenceInput' }
        reason:
          type: string
          description: Why a person decided this assertion should be remembered.
        overrideSecretWarning:
          type: boolean
          description: >
            Record this even though it looks like it may contain a credential.
            An override, not a receipt: the server does not and cannot know that
            a person was shown `fuseone:memory-secret-warned` first, so this is
            simply somebody with publish permission taking responsibility. The
            assertion is labelled `secret` when it is used, which is what makes
            the decision visible afterwards in the row and in the audit event.
            Content that certainly is a key is refused whatever this says.

    MemoryEvidenceInput:
      type: object
      required: [runId]
      description: >
        Which run, and which of the things it produced. The digest is absent on
        purpose: it is sixty-four characters nobody knows by heart, the ledger
        already holds it, and asking a person to copy it is asking them to
        retype something the platform is about to check against its own record.
      properties:
        runId: { type: string }
        artifact:
          type: string
          description: >
            Which of the run's outputs. Defaults to the closing answer, which is
            what a memory taught from a run almost always cites.

    MemoryMatchInput:
      type: object
      required: [company, area, namespace, kind, subject, signature]
      properties:
        company: { type: string }
        area: { type: string }
        namespace:
          type: string
          enum: [agent, shared]
          description: The namespace being taught, which decides what covers it.
        agentId:
          type: string
          description: >
            Whose namespace, when `namespace` is `agent`. Unlike creation, this
            is asked for rather than derived: there is no evidence yet to read
            an agent from, because nothing has been composed.
        kind: { type: string }
        subject: { type: string }
        signature: { type: string }

    MemoryMatch:
      type: object
      description: >
        What is already here. Every field may be absent, and all three absent
        means the fact is new.
      properties:
        own:
          allOf: [{ $ref: '#/components/schemas/MemoryAssertion' }]
          nullable: true
          description: The memory in the namespace being taught.
        shared:
          allOf: [{ $ref: '#/components/schemas/MemoryAssertion' }]
          nullable: true
          description: >
            The memory every agent in the scope reads, when an agent-scoped
            question is covered by one. Never set for a shared question.
        pending:
          allOf: [{ $ref: '#/components/schemas/MemorySuggestion' }]
          nullable: true
          description: The proposal nobody has decided yet.

    MemoryDisableInput:
      type: object
      required: [company, area, reason]
      properties:
        company: { type: string }
        area: { type: string }
        reason:
          type: string
          description: Why a person disabled this assertion.

    MemoryReactivateInput:
      type: object
      required: [company, area, reason]
      properties:
        company: { type: string }
        area: { type: string }
        reason:
          type: string
          minLength: 1
          description: >
            Why a person is bringing this assertion back. Required: the event
            is what makes reactivation an act rather than an update.

    MemorySuggestion:
      type: object
      description: >
        A structured assertion proposed by an opted-in agent. Pending
        suggestions are review material, not remembered facts; the memory tool
        only reads active MemoryAssertion rows.
      required:
        - id
        - assertionId
        - scope
        - agentId
        - kind
        - subject
        - signature
        - claim
        - evidence
        - observations
        - labels
        - status
        - createdBy
        - createdAt
        - updatedBy
        - updatedAt
      properties:
        id: { type: string }
        assertionId: { type: string }
        scope: { $ref: '#/components/schemas/Scope' }
        agentId: { type: string }
        kind: { type: string }
        subject: { type: string }
        signature: { type: string }
        claim: { type: string }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/MemoryEvidence' }
        observations: { type: integer, format: int64 }
        labels:
          type: array
          items: { type: string }
        status: { $ref: '#/components/schemas/MemorySuggestionStatus' }
        expiresAt: { type: string, format: date-time, nullable: true }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }

    MemorySuggestionReviewInput:
      type: object
      required: [company, area, reason]
      properties:
        company: { type: string }
        area: { type: string }
        reason:
          type: string
          description: Why a person accepted or dismissed this suggestion.

    MemorySuggestionAcceptInput:
      type: object
      required: [company, area, reason]
      properties:
        company: { type: string }
        area: { type: string }
        reason:
          type: string
          description: Why a person agreed to this suggestion.
        claim:
          type: string
          maxLength: 1200
          description: >
            The claim in the words being agreed to, when a person rewrote what
            the agent proposed. Omit to accept the wording as well as the fact.

            Only the claim. Subject, signature and kind are the identity:
            changing one here would not correct this memory, it would create a
            different one and mark this proposal accepted for a fact nobody
            proposed. Somebody who means that dismisses the proposal and teaches
            the other fact, which is two acts because it is two decisions.
        overrideSecretWarning:
          type: boolean
          description: >
            Record this even though the corrected claim looks like it may
            contain a credential. Same meaning as on creation: an override, not
            a receipt, and the assertion is labelled `secret` when it is used.

    MemoryAssertionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MemoryAssertion' }

    MemorySuggestionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MemorySuggestion' }

    Cost:
      type: object
      description: |
        Cache tokens are reported separately from input tokens: a cache read
        costs a fraction of the price, and without the split an expensive agent
        cannot be diagnosed.
      required: [micros]
      properties:
        micros: { type: integer, format: int64 }
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        cacheReadTokens: { type: integer, format: int64 }
        cacheWriteTokens: { type: integer, format: int64 }

    SimulationRequest:
      type: object
      description: >
        Either an uploaded set or the corpus. Running the corpus is the
        battery: it answers whether what was already corrected is still
        corrected.
      properties:
        corpus:
          type: boolean
          description: Replay the agent's regression corpus instead of an uploaded set.
        cases:
          type: string
          description: |
            One case per line, each a JSON object: an export of occurrences
            that already happened. Blank lines are not cases — every export
            ends in a newline, and counting it would put an empty occurrence in
            a report somebody reads as real.
          maxLength: 1048576

    SimulationAccepted:
      type: object
      required: [id, cases]
      properties:
        id: { type: string }
        cases:
          type: integer
          description: >
            How many runs the set actually opened. A file of fifty that opened
            forty-eight is a simulation of forty-eight cases, and saying fifty
            would give an author coverage that is a lie.

    SimulationSettled:
      type: string
      description: >
        Where a case ended. `unsettled` is a run still going when the turn
        bound ran out — a result, not a missing row: a planner that will not
        finish is one of the things a simulation exists to reveal.
      enum: [finished, parked, awaiting_approval, unsettled]

    SimulationAct:
      type: object
      description: |
        One thing the agent proposed, and what the Gate did about it. Anchored
        on the decision rather than on the call: the proposals that never
        became calls are the ones an author most needs to see.
      required: [tool, effect, verdict, reached]
      properties:
        step:
          type: string
          description: The declared step it was proposed in, which is what a correction anchors to.
        tool: { type: string }
        effect: { $ref: '#/components/schemas/ToolEffect' }
        verdict: { $ref: '#/components/schemas/Verdict' }
        rule:
          type: string
          description: Which check decided. Never "blocked by policy" — that tells an author nothing about what to change.
        policy:
          type: string
          description: >
            Which authored rule decided, when one did. Every policy decides
            under the rule name `policy`, so without this the report reads the
            same for all of them.
        reason: { type: string }
        reached:
          type: boolean
          description: >
            Whether it got as far as the tool layer, which under simulation is
            exactly where it stopped.

    SimulationCase:
      type: object
      required: [settled, steps, cost]
      properties:
        id:
          type: string
          description: The regression case this row replays, when it replays one.
        expected:
          type: array
          items: { $ref: '#/components/schemas/Expectation' }
        unmet:
          type: array
          description: What stopped being true. Empty is what an author wants to see.
          items: { $ref: '#/components/schemas/Expectation' }
        runId:
          type: string
          description: The run it drove. Absent when the case never opened one.
        settled: { $ref: '#/components/schemas/SimulationSettled' }
        steps: { type: integer }
        cost: { $ref: '#/components/schemas/Cost' }
        model:
          type: string
          description: What answered this case.
        drifted:
          type: boolean
          description: >
            Whether this case last held against a different model. Neither a
            pass nor a failure — the reason to read the rest of the row
            differently.
        acted:
          type: array
          items: { $ref: '#/components/schemas/SimulationAct' }
        outcome:
          type: string
          description: >
            The model's final answer when it is still readable. Absent is not
            itself a state: a running case may not have one yet, and an erased
            answer is named by outcomeState instead.
        outcomeState:
          $ref: '#/components/schemas/SimulationOutcomeState'
        reason: { type: string }
        error:
          type: string
          description: Why this case did not run, when it did not.

    SimulationOutcomeState:
      type: string
      description: >
        Why outcome is absent when the case did finish with one. This is a
        protocol field rather than a sentinel in outcome: outcome is user text,
        and a stable code inside it would be rendered as though the model said
        it.
      enum: [unavailable]
      x-enum-varnames: [SimulationOutcomeUnavailable]

    SimulationReport:
      type: object
      required: [id, cases, running]
      properties:
        held:
          type: integer
          description: Corrections that still stand. Zero for a simulation that is not a battery.
        broken:
          type: integer
          description: Corrections that stopped standing.
        drifted:
          type: integer
          description: |
            Cases whose model is no longer the one they last held against.

            It answers the question a rising broken count cannot: did somebody
            change the agent, or did a provider change the model under a name
            that did not change? The second is the one nobody notices, because
            nothing in this installation moved.
        id: { type: string }
        agent: { type: string }
        version: { type: string }
        cases:
          type: array
          items: { $ref: '#/components/schemas/SimulationCase' }
        running:
          type: boolean
          description: >
            Whether any case has yet to settle. Derived from the runs rather
            than tracked beside them: the runs are the queue, so a simulation
            is still going exactly when one of its runs is.

    GroupMapping:
      type: object
      description: >
        One group asserted by the provider, and the scoped grant it produces.
        A mapping normally names a company and an area. Naming company `*`
        with an empty area is the explicit installation-wide scope.
      required: [group, company, area, role]
      properties:
        group: { type: string }
        company: { type: string }
        area: { type: string }
        role:
          type: string
          enum: [admin, author, approver, curator, auditor]

    IdentityProvider:
      type: object
      required: [id, display, issuer, enabled, hasSecret]
      properties:
        id: { type: string }
        display: { type: string }
        issuer: { type: string }
        clientId: { type: string }
        hasSecret:
          type: boolean
          description: That a client secret is stored, never what it is.
        groupsClaim:
          type: string
          description: >
            Which claim carries group membership. Providers differ — Keycloak
            and Okta commonly use `groups`, Entra ID `roles`.
        mappings:
          type: array
          items: { $ref: '#/components/schemas/GroupMapping' }
        enabled: { type: boolean }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }

    IdentityProviderInput:
      type: object
      required: [display, issuer, clientId]
      properties:
        display: { type: string }
        issuer: { type: string }
        clientId: { type: string }
        clientSecret:
          type: string
          description: Omit to keep the stored one.
        groupsClaim: { type: string }
        mappings:
          type: array
          items: { $ref: '#/components/schemas/GroupMapping' }
        enabled: { type: boolean, default: true }

    GrantInput:
      type: object
      required: [company, area, role]
      properties:
        company: { type: string }
        area: { type: string }
        role:
          type: string
          enum: [admin, author, approver, curator, auditor]

    HeldGrant:
      type: object
      required: [company, area, role, asserted]
      properties:
        company: { type: string }
        area: { type: string }
        role:
          type: string
          enum: [admin, author, approver, curator, auditor]
        asserted:
          type: boolean
          description: >
            That an identity provider produced this on sign-in. It cannot be
            revoked here — it is re-derived the next time its holder signs in,
            so the group is what to change.
        by:
          type: string
          description: Who granted it, or which provider asserted it.

    Person:
      type: object
      required: [id, kind, display, disabled]
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [user, service, agent]
        display: { type: string }
        email: { type: string }
        provider:
          type: string
          description: Which identity provider vouched for them, if any.
        username:
          type: string
          description: >
            The handle they sign in with, when they have one. Absent for
            everybody who arrives through a provider, which is how a screen
            can tell the two apart without guessing from `provider`.
        grants:
          type: array
          items: { $ref: '#/components/schemas/HeldGrant' }
        lastSeen: { type: string, format: date-time }
        disabled: { type: boolean }

    Expectation:
      type: object
      description: >
        One thing that must be true of a case. The four kinds are what a fold
        of the run can answer without inventing anything — prose cannot be
        re-run, and a correction that cannot be re-run is a note.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [settles, calls, never_calls, asks]
        step:
          type: string
          description: >
            The declared step it is anchored to. A correction about the reply
            step must not start failing because the lookup step changed.
        value:
          type: string
          description: A tool, or a settled state, depending on the kind.

    RegressionCase:
      type: object
      required: [id, expectations]
      properties:
        id: { type: string }
        expectations:
          type: array
          items: { $ref: '#/components/schemas/Expectation' }
        fromRun:
          type: string
          description: The run the correction was made from. It may be purged long before this case is.
        note: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }

    RegressionInput:
      type: object
      required: [runId, expectations]
      properties:
        runId:
          type: string
          description: The run that came out wrong. Its occurrence is copied into the corpus.
        expectations:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Expectation' }
        note: { type: string }

    Retention:
      type: object
      required: [days, configured]
      properties:
        days: { type: integer }
        configured:
          type: boolean
          description: >
            False when nobody has set one and the default is in force. The
            distinction matters: a default is a promise the installation has
            not made deliberately.

    Stage:
      type: string
      description: >
        How far an agent is trusted to act alone. State beside the
        specification rather than in it: a published version is immutable and
        promotion is not a new version.
      enum: [draft, copilot, autonomous]

    Run:
      type: object
      required: [runId, scope, agentId, versionId, phase, seq, startedAt, cost]
      properties:
        runId: { type: string }
        scope: { $ref: '#/components/schemas/Scope' }
        agentId: { type: string }
        versionId:
          type: string
          description: The specification version the run is pinned to. Publishing a new version never affects a run already in flight.
        onBehalfOf: { type: string }
        phase: { $ref: '#/components/schemas/Phase' }
        seq:
          type: integer
          format: int64
          description: Sequence number of the last recorded step.
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time, nullable: true }
        cost: { $ref: '#/components/schemas/Cost' }
        reservedMicros:
          type: integer
          format: int64
          description: Outstanding reservations not yet reconciled.
        labels:
          type: array
          description: Accumulated data-flow labels of the run context.
          items: { type: string }
        pendingApproval:
          allOf: [{ $ref: '#/components/schemas/PendingApproval' }]
          nullable: true
        failure:
          allOf: [{ $ref: '#/components/schemas/RunFailure' }]
          nullable: true

    RunFailure:
      type: object
      required: [code]
      description: >
        Stable, low-cardinality failure detail for a run parked by the
        supervisor. The raw provider text is not part of this object.
      properties:
        code:
          type: string
          description: Stable reason code, such as model_provider_overloaded.
        provider:
          type: string
          description: Model provider that failed, when the cause came from one.
        status:
          type: integer
          description: HTTP status returned by the provider, when there was one.
        requestId:
          type: string
          description: Provider request id. It is shown on a run, never used as an aggregate label.
        retryable:
          type: boolean
          description: Whether trying later is expected to help.

    Tool:
      type: object
      required: [toolId, server, effect, untrusted]
      properties:
        toolId:
          type: string
          description: Namespaced by server, because two servers naming a tool "search" must not collide into one capability.
        server: { type: string }
        description: { type: string }
        effect: { $ref: '#/components/schemas/ToolEffect' }
        untrusted: { type: boolean }
        compensatedBy:
          type: string
          description: The tool that undoes this one, when the Curator has said which does.
        dedupe:
          $ref: '#/components/schemas/ToolDedupe'
        suggested:
          $ref: '#/components/schemas/ToolSuggestion'
        digest:
          type: string
          description: |
            Names the definition on offer right now — the server, the name, the
            description and the arguments, hashed.

            It travels to the screen so a ruling made there can say which
            definition it judged, the way an approval says which step it
            approved. A ruling that names a definition the server no longer
            offers is refused rather than applied to whatever answers to that
            name today.
        declaredBy:
          type: array
          items: { type: string }
          description: |
            The agents whose current version names this tool.

            Read before taking a tool off a server's surface. Off it the tool
            is not a capability this installation has, and an agent that still
            names it stops at the Gate with an unknown capability — correct,
            and the worst possible place to find out. The screen offering the
            choice says what the choice costs.

            Current versions only: an older one that names the tool is pinned
            to runs already recorded and cannot be started again.
        onSurface:
          type: boolean
          description: |
            Whether this installation brought the tool in. A tool discovered
            and not brought in is listed here and nowhere else — it reaches no
            model and answers no call — because "discovered and not taken" is a
            state somebody chose and the screen that offers the choice has to
            show it.
        stale:
          type: boolean
          description: |
            That a ruling exists and was overtaken by a new definition.

            Refused exactly like a tool nobody ruled on — the effect reads
            unclassified and the Gate stops it — and shown differently on
            purpose. A tool nobody ruled on is a decision to make; a tool that
            changed under its ruling is a decision to check, and rendering them
            alike makes the second look like somebody forgot.
        offered:
          type: boolean
          description: |
            Whether the server that offers this tool answers now.

            The list is what this installation has ever offered; whether a tool
            can actually be called is a fact about the server, and the two are
            different questions. A server that is removed or switched off stops
            offering its tools within a reconcile interval, and the list keeps
            them — an agent cannot call them either way, but a screen that did
            not say so would be listing capabilities nothing has.

    Stop:
      type: object
      required: [level, reason]
      properties:
        level:
          type: string
          enum: [installation, scope, agent]
        scope: { $ref: '#/components/schemas/Scope' }
        agentId: { type: string }
        reason:
          type: string
          description: Why, in the words of whoever threw it.
        by: { type: string }
        at: { type: string, format: date-time }

    StopRequest:
      type: object
      required: [level, stopped]
      properties:
        level:
          type: string
          enum: [installation, scope, agent]
        scope: { $ref: '#/components/schemas/Scope' }
        agentId: { type: string }
        stopped:
          type: boolean
          description: True stops it, false starts it again.
        reason:
          type: string
          maxLength: 500
          description: Required when stopping. Somebody else will find this.

    ModelPrice:
      type: object
      required: [provider, model]
      description: |
        Micros per million tokens. A configured contract rate is the only rate
        used for accounting in the installation's currency. Bundled market
        defaults are reference values with their own currency. Cache reads and
        cache writes are their own rates because a cache read costs a fraction
        of an input token.
      properties:
        provider: { type: string }
        model: { type: string }
        source:
          type: string
          enum: [configured, market_default]
          description: |
            Where this rate came from. Requests may omit it; writes always
            create configured rates in the installation's currency. Reads
            include market defaults as reference values when no configured
            rate exists.
        currency:
          type: string
          description: |
            Currency for reference market defaults, such as USD. Configured
            rates omit it because they are in the installation's currency.
        inputMicros: { type: integer, format: int64 }
        outputMicros: { type: integer, format: int64 }
        cacheReadMicros: { type: integer, format: int64 }
        cacheWriteMicros: { type: integer, format: int64 }
        sourceUrl:
          type: string
          description: Public pricing page used for a market default.
        sourceUpdatedAt:
          type: string
          description: Date the bundled market default was checked.

    MoneySettings:
      type: object
      required: [currency]
      description: |
        The currency code the installation uses for Cost.Micros and
        Budget.Micros. It is a unit label, not an exchange-rate engine:
        changing it does not convert existing ledger rows, ceilings or
        configured model prices.
      properties:
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          minLength: 3
          maxLength: 3
          description: Three-letter ISO 4217 currency code, such as BRL or USD.

    ModelPreset:
      type: object
      required: [name, kind]
      properties:
        name: { type: string }
        kind: { type: string, enum: [anthropic, openai_compatible] }
        baseUrl:
          type: string
          description: |
            Empty where the client already knows the address, and where the
            model is self-hosted and only the installation knows it.
        supportsEffort: { type: boolean }
        models:
          type: array
          description: |
            Models the platform knows this provider serves. Suggestions rather
            than a closed set: a list shipped in a binary ages between
            releases, and one that refused a model released last week would be
            worse than no list at all.
          items: { type: string }

    Transport:
      type: string
      description: >
        How a tool server is reached. `stdio` is a process this installation
        runs; `http` is an address it calls. The difference is not cosmetic — a
        command with arguments is code executed inside the worker's container,
        which is a far larger thing to hand somebody than a URL.
      enum: [stdio, http]

    MCPProtocolMode:
      type: string
      description: |
        How a Streamable HTTP MCP server is negotiated.

        Auto uses the SDK's current negotiation. Legacy skips the 2026
        server/discover probe and starts with the pre-2026 initialize flow for
        servers whose endpoint rejects the newer probe instead of negotiating
        it. Meaningless for stdio.
      enum: [auto, legacy]

    MCPOAuthGrant:
      type: object
      properties:
        accessToken:
          type: string
          description: Current OAuth access token. Never returned by a listing.
        refreshToken:
          type: string
          description: Refresh token used by the worker when the access token expires.
        tokenURL:
          type: string
          description: OAuth token endpoint.
        clientID:
          type: string
          description: Client identifier for refresh requests.
        clientSecret:
          type: string
          description: Client secret for refresh requests. Never returned by a listing.
        tokenType:
          type: string
          description: Authorization scheme. Defaults to Bearer.
        expiresAtUnix:
          type: integer
          format: int64
          description: Unix second when the access token expires. Zero means unknown.
        scopes:
          type: array
          items: { type: string }

    MCPUserCredentialInput:
      type: object
      properties:
        token:
          type: string
          description: >
            Bearer token for this signed-in user. Omit to keep the stored one.
            A non-empty token replaces stored headers or OAuth material.
        headers:
          type: object
          additionalProperties: { type: string }
          description: >
            Exact HTTP headers for this signed-in user. Omit to keep stored
            headers. A non-empty object replaces stored bearer or OAuth
            material.
        oauth:
          allOf: [{ $ref: '#/components/schemas/MCPOAuthGrant' }]
          description: >
            Manual OAuth grant for this signed-in user. Omit to keep the stored
            grant. A non-empty grant replaces bearer or header credentials.

    MCPUserCredential:
      type: object
      required: [server, hasCredential, hasHeaders, hasOAuth]
      properties:
        server:
          type: string
          description: The configured remote MCP server this credential belongs to.
        hasCredential:
          type: boolean
          description: Whether any personal credential is stored.
        hasHeaders:
          type: boolean
          description: Whether the stored credential is exact HTTP headers.
        hasOAuth:
          type: boolean
          description: Whether the stored credential is an OAuth grant.
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }

    MCPRateLimit:
      type: object
      description: >
        Per-worker token bucket for outgoing tool calls to one MCP server.
        With multiple worker replicas, each process has its own bucket; this
        is an operational guard against bursts, not an installation-wide quota.
        Set both fields to zero to disable it.
      properties:
        ratePerSecond:
          type: number
          format: double
          minimum: 0
        burst:
          type: integer
          minimum: 0

    MCPResultCache:
      type: object
      description: >
        Per-worker in-memory cache for successful read-only tool results from
        one MCP server. Each cache hit is recorded in the run trail as a cache
        hit, not as a fresh server call. Set both fields to zero to disable it.
      properties:
        ttlSeconds:
          type: integer
          minimum: 0
        maxEntries:
          type: integer
          minimum: 0

    MCPEgressDestination:
      type: object
      required: [host, port]
      properties:
        host:
          type: string
          description: >
            Exact host name, IPv4 literal, or wildcard suffix such as
            *.example.internal. It is a destination identity for a proxy
            policy, not a URL and never a credential-bearing value.
        port:
          type: integer
          minimum: 1
          maximum: 65535

    MCPStdioEgress:
      type: object
      required: [mode]
      description: >
        Requested egress handling for a stdio MCP process. Inherit is the
        historical behaviour: the process receives no proxy variables from
        FuseOne. Proxied requires allowed destinations, starts a worker-local
        proxy, and makes the worker refuse destinations outside that list.
      properties:
        mode:
          type: string
          enum: [inherit, proxied]
        allowedDestinations:
          type: array
          items: { $ref: '#/components/schemas/MCPEgressDestination' }
          description: >
            Destinations the worker-local proxy may connect to for this server.
            Empty or omitted is valid only for inherit.

    ConnectorEffect:
      type: string
      enum: [read, write, destructive, financial]
      description: >
        The broad effect an operation can have. The Gate still decides on real
        tools; this catalogue states the contract a governed connector must
        expose.

    ConnectorApproval:
      type: string
      enum: [none, policy, required]
      description: >
        Whether the operation is expected to run without a human decision,
        depends on policy, or is always a human decision before execution.

    ConnectorSecretHandling:
      type: string
      enum: [none, reference_only, plaintext_requires_approval]
      description: >
        How secret values may move through the connector. Reference-only means
        the model can name a stored value without receiving the value itself.

    GovernedConnectorOperation:
      type: object
      required: [id, name, summary, effects, approval, secretHandling, cachePolicy]
      properties:
        id:
          type: string
          description: Stable operation name a connector runtime exposes.
        name: { type: string }
        summary: { type: string }
        effects:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ConnectorEffect' }
        approval: { $ref: '#/components/schemas/ConnectorApproval' }
        secretHandling: { $ref: '#/components/schemas/ConnectorSecretHandling' }
        cachePolicy:
          $ref: '#/components/schemas/ConnectorCachePolicy'
          description: >
            Whether a result of this operation may be answered from a cache.
            An operation that has not decided reports `never`: a governed read
            served from a cache is a record of a read that did not happen.

    ConnectorCachePolicy:
      type: string
      enum: [never, short_lived]

    GovernedConnector:
      type: object
      required: [id, name, category, summary, maturity, guarantees, caveats, operations]
      properties:
        id:
          type: string
          description: Stable connector shape, not an instance name.
        name: { type: string }
        category:
          type: string
          enum: [automation, data, infrastructure, messaging, network, secrets, security]
        summary: { type: string }
        maturity:
          type: string
          enum: [planned, runtime]
          description: >
            Planned means the catalogue describes the intended governed shape
            but the connector is not executable in this release. Runtime means
            configured instances can expose executable tools.
        guarantees:
          type: array
          items: { type: string }
        caveats:
          type: array
          items: { type: string }
        operations:
          type: array
          items: { $ref: '#/components/schemas/GovernedConnectorOperation' }

    ConnectorScopeKind:
      type: string
      enum: [installation, company, area]
      description: >
        Where the connector instance is configured. Installation applies to all
        companies, company applies to all areas in one company, and area
        applies to one area.

    ConnectorVaultConfig:
      type: object
      required: [address, mount, allowedPathPrefixes]
      properties:
        address:
          type: string
          description: >
            Vault HTTP endpoint. Cloud metadata and link-local destinations are
            refused before the instance can run.
        mount:
          type: string
          description: KV v2 mount name.
        namespace:
          type: string
          description: Optional Vault namespace.
        allowedPathPrefixes:
          type: array
          minItems: 1
          items: { type: string }
          description: >
            Secret path prefixes this instance may touch. A prefix matches the
            path itself or children below it; lookalike prefixes do not match.

    ConnectorInstance:
      type: object
      required: [name, connector, enabled, scopeKind, hasToken]
      properties:
        name:
          type: string
          description: Instance name used in tool ids.
        connector:
          type: string
          description: Connector shape, such as vault.
        enabled: { type: boolean }
        scopeKind: { $ref: '#/components/schemas/ConnectorScopeKind' }
        company: { type: string }
        area: { type: string }
        hasToken:
          type: boolean
          description: Whether a token is stored. The token is never returned.
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
        vault: { $ref: '#/components/schemas/ConnectorVaultConfig' }
        sql: { $ref: '#/components/schemas/ConnectorSQLResponse' }

    ConnectorSQLResponse:
      type: object
      description: >
        A SQL instance as the administration API reports it. Addressing only,
        plus the safe identity of the binding: the kind, which vault instance
        answers it and which role is bound. No token, no generated credential
        and no connection string are ever returned, because none of them is
        needed to know the configuration is right.
      required: [host, port, database, credentialSource]
      properties:
        host: { type: string }
        port: { type: integer }
        database: { type: string }
        credentialSource: { $ref: '#/components/schemas/ConnectorCredentialSource' }

    ConnectorCredentialSource:
      type: object
      required: [kind, vaultInstance, mount, role]
      properties:
        kind:
          type: string
          enum: [vault_database_role]
        vaultInstance:
          type: string
          description: Name of the vault instance that issues the credential.
        mount: { type: string }
        role: { type: string }

    ConnectorSQLInput:
      type: object
      description: >
        Addressing is structured on purpose. A connection string is one field
        that can carry a password, so there is nowhere here to write one.
      required: [host, port, database, credentialSource]
      properties:
        host:
          type: string
          description: Bare hostname. Port, database and credentials are separate.
        port: { type: integer }
        database: { type: string }
        credentialSource: { $ref: '#/components/schemas/ConnectorCredentialSource' }

    ConnectorInstanceInput:
      type: object
      required: [connector, scopeKind]
      properties:
        connector:
          type: string
          description: Connector shape. The first runtime connector is vault.
        enabled:
          type: boolean
          default: true
        scopeKind: { $ref: '#/components/schemas/ConnectorScopeKind' }
        company: { type: string }
        area: { type: string }
        vault: { $ref: '#/components/schemas/ConnectorVaultConfig' }
        sql: { $ref: '#/components/schemas/ConnectorSQLInput' }
        token:
          type: string
          description: >
            Connector token to seal. Omit to keep the stored token.
        clearToken:
          type: boolean
          description: >
            Remove the stored token. An enabled instance is refused unless the
            same request also supplies a replacement token.

    MCPServerCallAuth:
      type: object
      required: [policy, callerHasPersonalCredential]
      description: |
        What the API can say about authentication for tools/call for the
        signed-in caller. This is not a trust decision and not a Gate verdict:
        surface, classification and policy still decide whether a tool may run.
      properties:
        policy:
          type: string
          enum: [unknown, installation_or_service, personal_required, local_process]
          description: |
            unknown: no catalogue recipe verifies this remote server's auth
            shape. installation_or_service: the recipe documents a service,
            installation or no-credential path. personal_required: every
            documented credential path carries user authority, so a tool call
            needs the caller's personal MCP credential. local_process: stdio
            starts a process with installation-side environment/configuration;
            no per-user request exists when it starts.
        callerHasPersonalCredential:
          type: boolean
          description: |
            Whether the signed-in caller has a personal credential stored for
            this server. Presence only; the sealed material never leaves the
            vault, and the API never accepts a principal parameter for this.

    MCPServerEgress:
      type: object
      required: [policy]
      description: |
        What the platform can say about outbound network reach for this MCP
        transport. This is not a claim that egress is contained: the API names
        the narrow refusals that exist, proxy requests that the worker will
        enforce at process start, and the unconstrained cases that remain.
      properties:
        policy:
          type: string
          enum: [unknown, metadata_refused, proxy_requested, proxy_with_network_policy, unconstrained_local_process]
          description: |
            unknown: the worker observed the server but the console does not
            know its transport/configuration. metadata_refused: HTTP MCP uses
            local DNS resolution and refuses cloud metadata/link-local
            destinations and environment proxies; private network and internet
            destinations are otherwise allowed. proxy_requested: stdio receives
            HTTP(S) proxy variables for a worker-local proxy that refuses
            destinations outside the stored allow-list; deployment-level network
            policy is still what prevents bypass. proxy_with_network_policy: the
            same local proxy is requested and the operator has explicitly
            declared that the worker deployment is covered by enforced
            NetworkPolicy, which is not inferred from manifest presence.
            unconstrained_local_process: stdio
            starts a process on the worker and the platform does not constrain
            its outbound destinations.

    MCPServer:
      type: object
      required: [name, enabled]
      properties:
        name:
          type: string
          description: Namespaces the tools it offers, so two servers naming a tool "search" do not collide.
        transport: { $ref: '#/components/schemas/Transport' }
        command:
          type: string
          description: The local process, for stdio.
        args:
          type: array
          items: { type: string }
        url:
          type: string
          description: The endpoint, for http.
        protocolMode:
          allOf: [{ $ref: '#/components/schemas/MCPProtocolMode' }]
          description: >
            How the HTTP MCP protocol is negotiated. Absent reads as auto.
            Legacy exists for servers that are current but have not adopted
            the 2026 server/discover probe yet.
        hasSecret:
          type: boolean
          description: That a credential document is stored, never what it is.
        hasOAuth:
          type: boolean
          description: >
            The sealed credential document includes an OAuth grant for a
            remote server. The grant never comes back through this API.
        hasVariables:
          type: boolean
          description: >
            The sealed credential document includes environment variables for
            a local process. The values never come back through this API.
        hasConfigFile:
          type: boolean
          description: >
            The sealed credential document includes a platform-managed
            configuration file. The content never comes back through this API.
        configFileEnv:
          type: string
          description: >
            The environment variable that receives the managed configuration
            file path for a local server. Absent means the platform default.
        surface:
          type: array
          items: { type: string }
          nullable: true
          description: |
            Which of the server's tools this installation brought in, by the
            names the server uses.

            Absent is not empty. A server whose surface nobody has chosen goes
            on offering what it always did — an upgrade must not silently take
            every tool away — and one chosen as empty offers nothing. A tool
            that appears later on a server with a chosen surface arrives
            outside it, for the reason a new tool arrives unclassified: nobody
            has said.

            It is not a permission. Outside the surface a tool is not "allowed
            with conditions"; it is not here. No model is told about it, no
            call reaches it, and the Gate is never asked.
        rateLimit:
          allOf: [{ $ref: '#/components/schemas/MCPRateLimit' }]
          nullable: true
        cache:
          allOf: [{ $ref: '#/components/schemas/MCPResultCache' }]
          nullable: true
        stdioEgress:
          allOf: [{ $ref: '#/components/schemas/MCPStdioEgress' }]
          nullable: true
          description: >
            The stored egress request for a stdio server. Absent means inherit.
        callAuth:
          allOf: [{ $ref: '#/components/schemas/MCPServerCallAuth' }]
          nullable: true
          description: |
            Authentication usability for tools/call for the signed-in caller.
            A server can answer discovery and still be unusable for a run by
            this person when personal credentials are required and absent.
        egress:
          allOf: [{ $ref: '#/components/schemas/MCPServerEgress' }]
          nullable: true
          description: |
            The outbound network statement this API can honestly make for the
            transport. It names narrow refusals, not an egress-control promise.
        acceptsLocalExecution:
          type: boolean
          description: |
            That somebody accepted what stdio is. A local server is a program
            this installation starts inside the worker: it runs as the worker,
            on its filesystem, from inside its network. The Gate governs what a
            tool may do and governs nothing about what a process may read, so
            this is not a control against a hostile administrator — it is
            informed consent, and a record of who gave it.

            Required for stdio and meaningless for http, where the platform
            sends a request rather than starting a program.
        enabled: { type: boolean }
        managed:
          type: boolean
          description: |
            Whether this server is configured from the console. False for one
            passed to the process by flag or environment: the platform is
            connected to it and cannot change it here, and hiding it would make
            this screen disagree with what the installation actually talks to.
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
        health:
          allOf: [{ $ref: '#/components/schemas/IntegrationHealth' }]
          nullable: true
          description: |
            What the platform observed the last time it tried to reach this
            server. Absent when no worker has tried yet, which is a different
            thing from a server that failed.

    ServerRecipe:
      type: object
      required: [server, title, category, publisher, docsFrom, provenance, status, configRequirements, requiresPersonalCredential]
      properties:
        server:
          type: string
          description: The local name this applies to, and what a discovered tool is matched by.
        title: { type: string }
        category:
          type: string
          description: >
            What the server is for, which is the question somebody browsing is
            asking. A closed, coarse list: a shelf people argue about is one
            they stop using.
        publisher:
          type: string
          description: Who publishes the server. Never this platform.
        docs: { type: string }
        docsFrom:
          type: string
          enum: [publisher, third-party]
          description: |
            Whose documentation `docs` points at.

            Separate from `provenance` because they are different questions. A
            community server somebody actually ran has trustworthy suggestions
            and nobody standing behind it; a publisher's own server read off
            their site is the reverse. Neither is "official", and that word is
            not to be rendered: it is the one a reader takes as a promise of
            support that nobody made.
        provenance:
          type: string
          enum: [server, documentation]
          description: >
            Where the suggestions came from — somebody ran this server, or
            somebody read a page.
        status:
          type: string
          enum: [published, reference, archived]
          description: |
            The kind of recipe this is, not an endorsement.

            Published means the publisher currently documents this server.
            Reference means the protocol or SDK repository presents it as an
            example/reference implementation. Archived means the source says
            the implementation moved, aged out or should no longer be treated
            as the current path. The console renders these differently because
            a reference or archived server must not read like a maintained
            vendor integration.
        configRequirements:
          type: array
          items:
            type: string
            enum: [credential, env, file, path]
          description: |
            What the operator must bring before this recipe can really run.

            Credential is an access token, DSN, key or OAuth grant. Env is a
            sealed environment variable given only to this local process. File
            is configuration content the platform should store and materialise;
            path is a filesystem/repository root the worker must be able to
            see. A path typed into args is not the same thing as a file the
            platform owns.
        authModes:
          type: array
          items: { $ref: '#/components/schemas/ServerRecipeAuthMode' }
          description: |
            Structured authentication facts for this recipe.

            This is not a support promise from the runtime. It is what the
            publisher or referenced docs say the server expects: OAuth, bearer
            token, Basic auth, custom headers, DSN, sealed environment
            variables, generated config file, path access, or no auth at all.
            Keeping this separate from the prose prevents every provider from
            collapsing into "paste a token here".
        requiresPersonalCredential:
          type: boolean
          description: |
            Whether every documented credential shape for this recipe carries a
            user's authority. This is the same rule the worker uses when a run
            calls tools: if it is true, a run without a principal or without
            that principal's credential stops instead of falling back to the
            installation credential.
        protocolMode:
          allOf: [{ $ref: '#/components/schemas/MCPProtocolMode' }]
          description: >
            Suggested HTTP protocol negotiation mode. It fills the form and
            decides nothing; legacy is for endpoints that reject the current
            server/discover probe.
        transport: { $ref: '#/components/schemas/Transport' }
        command: { type: string }
        args:
          type: array
          items: { type: string }
        url: { type: string }
        auth:
          type: string
          description: >
            The credential it expects, in words somebody reads before going to
            fetch one: what to get, and what it will be able to reach.
        note:
          type: string
          description: What an operator has to know before running it at all.
        suggestions:
          type: integer
          description: >
            How many of its tools this platform has an opinion about. A recipe
            with none is still worth having — identity, a link and a warning
            about the credential — and effects invented for unverified names
            would not be.

    ServerRecipeAuthMode:
      type: object
      required: [type, principal]
      properties:
        type:
          type: string
          enum: [none, oauth2, bearer, basic, headers, env, config_file, path, dsn]
          description: How the credential is presented to the MCP server.
        principal:
          type: string
          enum: [none, user, installation, service]
          description: Whose authority this credential carries.
        label:
          type: string
          description: Short human label for the credential shape.
        header:
          type: string
          description: HTTP header used by header-based auth modes.
        headers:
          type: array
          items: { type: string }
          description: >
            HTTP headers required together by a header-based auth mode. A
            single header may use `header`; multiple headers use this list so
            the console asks for each value rather than flattening them into a
            bearer token.
        env:
          type: string
          description: >
            Environment variable that receives this credential when the server
            is local. Used for DSNs whose runtime path is a sealed env var.
        prefix:
          type: string
          description: Header prefix, such as Bearer or Basic.
        scopes:
          type: array
          items: { type: string }
          description: OAuth scopes or provider permissions named by the recipe.
        note:
          type: string
          description: Provider-specific caveat about this auth mode.

    IntegrationHealth:
      type: object
      required: [reachable, toolCount, observedAt]
      properties:
        reachable: { type: boolean }
        toolCount:
          type: integer
          description: |
            How many tools it offered. Zero on an unreachable server and also
            on a reachable one that offers nothing, which is why reachable is
            separate rather than inferred from this.
        detail:
          type: string
          description: Why it failed, when it did. Shown as-is — the reader is who fixes the server.
        observedAt: { type: string, format: date-time }
        observedBy:
          type: string
          description: |
            Which worker saw this. Several connect to the same servers and can
            disagree — one pod on a network that reaches it, one not.
        lastReachableAt:
          type: string
          format: date-time
          description: The last successful discovery probe, if one has ever answered.
        toolCall:
          allOf: [{ $ref: '#/components/schemas/IntegrationToolCallHealth' }]
          nullable: true
          description: |
            The last concrete tools/call observation. Discovery can work while
            calls fail because credentials, rate limits and runtime policy sit
            on a different path.

    IntegrationToolCallHealth:
      type: object
      required: [ok, code, observedAt]
      properties:
        ok: { type: boolean }
        code:
          type: string
          description: Stable failure family, or "none" for the last successful call.
        observedAt: { type: string, format: date-time }
        observedBy:
          type: string
          description: Which worker made the call observation.
        lastOkAt:
          type: string
          format: date-time
          description: The last successful tools/call observation, if one has ever succeeded.

    ModelProvider:
      type: object
      required: [name, kind, baseUrl, enabled, hasKey]
      properties:
        name: { type: string }
        kind:
          type: string
          enum: [anthropic, openai_compatible]
        baseUrl: { type: string }
        enabled: { type: boolean }
        hasKey:
          type: boolean
          description: Whether a credential is stored. The credential itself never leaves the vault through this API.
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }

    InterviewAnswers:
      type: object
      description: |
        The prose half of the interview. Every question that bears on what the
        assistant answers is here: three of the seven were collected by the
        screen and never sent, and the worst omission was the limit the author
        stated — the one question this audience answers without hesitating,
        and the one that most changes which tools should be proposed.

        Two questions are deliberately absent. When the agent starts is
        configuration, its home is the field, and an agent that starts itself
        because a wizard defaulted is the worst default this product could
        have.

        How the author knows the work is finished is absent for a sharper
        reason: this call produces `stops_when`, which is the exception that
        ends a step, and a success condition read as an exception makes an
        agent stop at the moment it succeeds. Until the prompt can hold the
        two apart, the answer stays where it is unambiguous — the instruction,
        beside how the work is done.
      properties:
        mustKnow: { type: string }
        steps: { type: string }
        goesWrong: { type: string }
        notDecide: { type: string }
        neverDo:
          type: string
          description: What the author says must never happen (FU-07).

    InterviewCapture:
      type: object
      required: [text]
      description: |
        The author's free description of the work. It is input to extraction
        only: the model may propose values for the fixed fields, but it never
        chooses the fields themselves.
      properties:
        text:
          type: string
          maxLength: 12000

    InterviewSuggestedAnswers:
      type: object
      required: [trigger, mustKnow, steps, goesWrong, notDecide, closing, neverDo]
      properties:
        trigger: { type: string }
        mustKnow: { type: string }
        steps: { type: string }
        goesWrong: { type: string }
        notDecide: { type: string }
        closing: { type: string }
        neverDo:
          type: string
          description: What the author says must never happen (FU-07).

    InterviewSuggestions:
      type: object
      required: [answers]
      properties:
        answers: { $ref: '#/components/schemas/InterviewSuggestedAnswers' }
        micros:
          type: integer
          format: int64
          description: What this suggestion call cost, appended to the trail as well.

    InstructionText:
      type: object
      required: [provider, model, instructions]
      properties:
        provider: { type: string }
        model:
          type: string
          description: >
            The model the agent is configured to use. It comes back in the
            reply, so an answer read on its own says what counted it — a
            token count means nothing without the model that produced it.
        instructions: { type: string }

    InstructionTokens:
      type: object
      required: [counted, model]
      properties:
        counted:
          type: boolean
          description: >
            False means this provider has no way to count. It is a state and
            not an error, and it carries no number rather than a guess.
          example: true
        tokens:
          type: integer
          format: int64
          description: Absent whenever counted is false.
        model: { type: string }

    InterviewDraft:
      type: object
      required: [tools, steps]
      properties:
        tools:
          type: array
          items: { type: string }
        steps:
          type: array
          items: { $ref: '#/components/schemas/AgentStep' }
        micros:
          type: integer
          format: int64
          description: What this call cost, appended to the trail as well.

    AgentStep:
      type: object
      description: >
        A stage of the process: an envelope with a gate at its exit. The same
        shape the interview produces and a definition carries, because they
        are the same thing at two moments.
      required: [name]
      properties:
        name: { type: string }
        reaches:
          type: array
          description: >
            What the Gate allows while the run is in this step. Empty is
            meaningful: a step that calls nothing is the agent thinking.
          items: { type: string }
        stopsWhen:
          type: string
          description: >
            The exception, in the author's own words. Nothing judges it yet —
            who decides a step is over is a separate decision.
        model:
          type: string
          description: >
            Overrides the agent's model for this step alone (PRD FO-10). The
            provider deliberately cannot be overridden: it carries a
            credential, and a definition able to choose one could route an
            installation's traffic somewhere its author picked.
        effort: { type: string }

    AuthoringChoice:
      type: object
      required: [provider, model, enabled]
      properties:
        provider:
          type: string
          description: The name of a provider registered under /admin/integrations.
        model: { type: string }
        effort: { type: string }
        dailyMicros:
          type: integer
          format: int64
          description: |
            What the assistant may spend in a day. Required: this is the only
            place the platform spends outside a run — no Gate, no ledger, no
            per-run ceiling — so the bound is part of configuring it rather
            than something added afterwards.
        enabled:
          type: boolean
          description: |
            False means the installation has no authoring assistant, which is a
            supported state rather than a broken one.

    RegisteredScope:
      type: object
      required: [company, area]
      properties:
        company: { type: string }
        area:
          type: string
          description: The canonical id. Lowercase, no accents, hyphenated.
        label:
          type: string
          description: How it is shown. Empty means show the id.
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }

    ScopeBudget:
      type: object
      required: [scopeKind, period, enabled]
      properties:
        scopeKind:
          type: string
          enum: [installation, company, area]
        scope: { $ref: '#/components/schemas/Scope' }
        period:
          type: string
          enum: [daily, monthly]
        micros: { type: integer, format: int64 }
        tokens: { type: integer, format: int64 }
        toolCalls: { type: integer, format: int64 }
        steps: { type: integer, format: int64 }
        wallClockMs: { type: integer, format: int64 }
        enabled: { type: boolean }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }

    Company:
      type: object
      required: [id, label, areas, archived]
      properties:
        id: { type: string }
        label: { type: string }
        areas:
          type: integer
          description: How many areas are registered in it.
        archived: { type: boolean }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }

    Channel:
      type: object
      required: [name, kind, enabled, hasCredential, conversations]
      properties:
        name: { type: string }
        kind: { type: string }
        workspace: { type: string }
        deliveryMode:
          type: string
          enum: [http, socket]
          description: How Slack asks reach this installation. Empty legacy rows read as http.
        enabled: { type: boolean }
        hasCredential:
          type: boolean
          description: Whether the bot token used for posting is stored, never what it is.
        hasSigning:
          type: boolean
          description: >
            Whether this channel can verify what arrives. A channel posts long
            before anybody switches the inbound half on.
        hasAppToken:
          type: boolean
          description: Whether the Socket Mode app-level token is stored, never what it is.
        conversations:
          type: array
          items: { $ref: '#/components/schemas/ChannelConversation' }
        identities:
          type: array
          description: The accounts that speak for somebody in this channel.
          items: { $ref: '#/components/schemas/ChannelIdentity' }
        seenAccounts:
          type: array
          description: >
            Channel accounts this installation has seen interact with it.
            Convenience for binding only; it grants nothing.
          items: { $ref: '#/components/schemas/ChannelSeenAccount' }

    ChannelIdentity:
      type: object
      description: |
        Which platform user a channel account speaks for.
      required: [account, principal]
      properties:
        account: { type: string }
        principal: { type: string }
        display:
          type: string
          description: Who that is, for the screen. Never the key.
        unreadable:
          type: boolean
          description: |
            The binding is stored and cannot be understood. Listed rather than
            hidden: the runtime refuses an ask on one of these and names it, so
            a screen that dropped it would leave an operator reading an error
            about a binding the console says does not exist.

            `principal` is empty on one of these. What names it — the channel
            and the account — is recovered from the row's key, which is what
            makes it removable.

    ChannelSeenAccount:
      type: object
      description: |
        A channel account seen in a signed event, but not necessarily bound.
        This is a hint for an administrator, not authority.
      required: [account, lastSeen]
      properties:
        account: { type: string }
        conversation: { type: string }
        lastSeen:
          type: string
          format: date-time

    ChannelConversation:
      type: object
      required: [id, scope, enabled]
      properties:
        id: { type: string }
        label: { type: string }
        scope: { $ref: '#/components/schemas/Scope' }
        mode:
          type: string
          enum: [mentions, watch, both]
          description: How inbound Slack messages may start runs. Empty legacy rows read as mentions.
        threadContext:
          type: boolean
          description: |
            Whether a mention made inside an existing vendor thread includes
            earlier thread messages in the run input. The text remains
            untrusted; this only supplies context for the agent to read.
        sources:
          type: array
          items: { type: string }
        agent: { type: string }
        runAs: { type: string }
        wants:
          type: array
          items: { type: string }
        enabled: { type: boolean }

    AuditPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEntry' }
        nextCursor: { type: string, nullable: true }

    AuditEntry:
      type: object
      required: [at, source, actor, verb, target]
      properties:
        at: { type: string, format: date-time }
        source:
          type: string
          enum: [ledger, admin]
          description: |
            Which record this came from, and therefore what can be proved about
            it. Ledger entries are hash-chained; administrative ones are
            append-only but not chained.
        actor:
          type: string
          description: |
            A person for an administrative change or a human decision; the
            agent for a Gate decision, because the Gate decides about an
            agent's proposal rather than on anybody's behalf.
        verb:
          type: string
          description: Past tense, namespaced — tool.classified, gate.blocked, approval.granted.
        target: { type: string }
        scope: { $ref: '#/components/schemas/Scope' }
        detail: { type: object, additionalProperties: true }
        runId: { type: string }
        seq: { type: integer, format: int64 }
        hash:
          type: string
          description: |
            Seals this entry to the one before it. Present only on ledger
            entries; an administrative entry has nothing to show here and says
            so by omission rather than by an empty promise.

    Simulation:
      type: object
      required: [considered, matched, unknown, samples]
      properties:
        considered:
          type: integer
          description: |
            How many recorded decisions were examined. Zero matches out of zero
            decisions is not evidence a rule is harmless, and this is what lets
            a screen tell the two apart.
        matched: { type: integer }
        unknown:
          type: integer
          description: |
            Decisions the rule could not be answered against, because it reads
            arguments and those did not keep any.
        wouldDeny: { type: integer }
        wouldEscalate: { type: integer }
        samples:
          type: array
          description: A few of the matches, so a number has runs behind it.
          items: { $ref: '#/components/schemas/SimulationSample' }

    SimulationSample:
      type: object
      required: [runId, seq, tool, was, wouldBe]
      properties:
        runId: { type: string }
        seq: { type: integer, format: int64 }
        tool: { type: string }
        was: { $ref: '#/components/schemas/Verdict' }
        wouldBe: { $ref: '#/components/schemas/Verdict' }

    PolicyPage:
      type: object
      required: [items, policyHash]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Policy' }
        policyHash:
          type: string
          description: Names the set as a whole. Every decision records it.

    PolicyWritten:
      type: object
      required: [policy, policyHash]
      properties:
        policy: { $ref: '#/components/schemas/Policy' }
        policyHash: { type: string }

    PolicyInput:
      type: object
      required: [name, effect, mode]
      properties:
        name: { type: string }
        owner: { type: string }
        reason:
          type: string
          description: |
            The sentence shown in the trail and to whoever is denied. The
            difference between "blocked by POL-114" and knowing what to do.
        resource:
          type: string
          description: A glob over the tool id — `crm.*`, `crm.reply`, `*`.
        effects:
          type: array
          description: Which effects it covers. Empty means any.
          items: { $ref: '#/components/schemas/Effect' }
        reach:
          type: string
          enum: [installation, scopes, agents]
        scopes:
          type: array
          items: { $ref: '#/components/schemas/Scope' }
        agents:
          type: array
          items: { type: string }
        conditions:
          type: array
          description: Every clause must hold. There is no "or".
          items: { $ref: '#/components/schemas/PolicyCondition' }
        effect:
          type: string
          enum: [allow, escalate, deny]
        mode:
          type: string
          enum: [monitor, enforce]
          description: |
            A monitored policy is evaluated and recorded and changes no
            verdict, so an operator can read what it would have done before it
            does it.
        enabled: { type: boolean }

    PolicyCondition:
      type: object
      required: [field, op, value]
      properties:
        field:
          type: string
          description: tool.id, tool.effect, data.taint, agent.id, scope.area, or args.<path>.
        op:
          type: string
          enum: [eq, ne, gt, lt, contains, in]
        value: { type: string }

    Policy:
      allOf:
        - $ref: '#/components/schemas/PolicyInput'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              description: Set once and never changed — it appears in the trail and in what a denied person reads.
            hits:
              type: integer
              format: int64
              description: How many decisions this rule produced in the period.
            updatedBy: { type: string }
            updatedAt: { type: string, format: date-time }

    VersionComparison:
      type: object
      description: >
        Two versions of one agent, checked against the same corrections.
      required: [from, to, cases, regressed, fixed, costMicros]
      properties:
        from: { type: string }
        to: { type: string }
        regressed:
          type: integer
          description: Corrections that held on the older version and no longer hold.
        fixed:
          type: integer
          description: Corrections that were broken and hold again.
        costMicros:
          type: integer
          format: int64
          description: >
            The movement in cost over every case both versions ran, new minus
            old. Cases only one side ran are left out: a total mixing a rise
            in price with a case that did not exist yet cannot be acted on.
        cases:
          type: array
          description: >
            Ordered so the answer is the first row — regressions, then what is
            still broken, then what was fixed. Fully ordered, so two readings
            of the same two versions cannot disagree.
          items: { $ref: '#/components/schemas/CaseChange' }

    CaseChange:
      type: object
      required: [id, was, now, costMicros, steps]
      properties:
        id: { type: string }
        was: { $ref: '#/components/schemas/Standing' }
        now: { $ref: '#/components/schemas/Standing' }
        costMicros:
          type: integer
          format: int64
          description: New minus old. An agent that reaches the same answer for three times the money is worse.
        steps: { type: integer }

    Standing:
      type: string
      description: >
        How a case stood in one battery. `absent` is a case that battery never
        ran — reported rather than dropped, because a corpus that grew between
        the two versions is a real difference.
      enum: [held, broke, absent]

    AgentTrust:
      type: object
      description: >
        Promotion evidence for one published agent version. Every judgement
        comes from structured ledger facts and stable codes, never from
        instruction prose.
      required: [versionId, status, recommendation, summary, window, evidence]
      properties:
        versionId: { type: string }
        previousVersionId:
          type: string
          nullable: true
          description: The baseline version, absent when this is the first published version.
        status: { $ref: '#/components/schemas/AgentTrustStatus' }
        recommendation: { $ref: '#/components/schemas/AgentTrustRecommendation' }
        summary: { $ref: '#/components/schemas/AgentTrustSummary' }
        window: { $ref: '#/components/schemas/AgentTrustWindow' }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/AgentTrustEvidence' }

    AgentTrustWindow:
      type: object
      description: >
        Time window used for run-derived trust evidence. Simulation, version
        comparison, launch state and capability drift may use non-windowed
        facts, but run history, cost, human decisions and Gate blocks are
        judged only inside this period.
      required: [from, until]
      properties:
        from: { type: string, format: date-time }
        until: { type: string, format: date-time }

    AgentTrustStatus:
      type: string
      enum: [ready, needs_evidence, needs_review]

    AgentTrustRecommendation:
      type: string
      enum: [collect, review, demote, copilot, autonomous, keep]

    AgentTrustSummary:
      type: string
      enum: [ready, evidence, review]

    AgentTrustEvidenceStatus:
      type: string
      enum: [good, bad, missing, unknown]

    AgentTrustEvidenceId:
      type: string
      enum: [runs, simulation, policy, decisions, launch, version, cost, capabilities]

    AgentTrustEvidenceCode:
      type: string
      description: Stable reason for this evidence row.
      enum:
        - runs_missing
        - runs_finished
        - runs_unfinished
        - runs_waiting
        - runs_in_progress
        - runs_unknown
        - simulation_missing_corpus
        - simulation_not_run
        - simulation_ready
        - simulation_broken
        - simulation_regressed
        - simulation_incomplete
        - decisions_waiting
        - decisions_quiet
        - decisions_missing
        - decisions_approved
        - decisions_refused
        - launch_running
        - launch_paused
        - version_no_previous
        - version_compared
        - version_regressed
        - version_missing_baseline
        - cost_missing
        - cost_stable
        - cost_increased
        - cost_decreased
        - policy_missing
        - policy_no_blocks
        - policy_blocks
        - policy_blocks_increased
        - policy_blocks_decreased
        - capabilities_no_previous
        - capabilities_unchanged
        - capabilities_added
        - capabilities_removed

    AgentTrustEvidence:
      type: object
      required: [id, status, code, values]
      properties:
        id: { $ref: '#/components/schemas/AgentTrustEvidenceId' }
        status: { $ref: '#/components/schemas/AgentTrustEvidenceStatus' }
        code: { $ref: '#/components/schemas/AgentTrustEvidenceCode' }
        values:
          type: object
          description: >
            Counts, version identifiers and timestamps used to render the
            evidence. Values are identifiers and aggregates only; content and
            diagnostics stay out of this contract.
          additionalProperties: true

    AdminEvent:
      type: object
      required: [at, principalId, action, target]
      properties:
        at: { type: string, format: date-time }
        principalId: { type: string }
        scope: { $ref: '#/components/schemas/Scope' }
        action:
          type: string
          description: Past tense, namespaced by what it touched — tool.classified, provider.created.
        target: { type: string }
        detail: { type: object, additionalProperties: true }

    AdminEventPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminEvent' }
        nextCursor: { type: string, nullable: true }

    Agent:
      type: object
      required: [agentId, versionId, scope, name, provider, model, tools, budget, publishedAt, latest]
      properties:
        agentId: { type: string }
        stage:
          allOf: [{ $ref: '#/components/schemas/Stage' }]
          description: >
            Absent on an older reading. A client that does not find one should
            assume draft, which is what the platform assumes.
        paused:
          type: boolean
          description: >
            Whether the agent is stopped. Absent on an older reading, and an
            agent nobody has decided about is paused — reading an absent
            answer as running would show an agent as live because a write
            failed.
        retired:
          type: boolean
          description: >
            Whether the agent is out of circulation. It keeps its versions and
            its runs; what it loses is every listing and the ability to start.
        versionId:
          type: string
          description: The digest of the definition's content. Publishing new text is a new version; the old one stays readable.
        scope: { $ref: '#/components/schemas/Scope' }
        name: { type: string }
        provider: { type: string }
        model: { type: string }
        effort: { type: string }
        tools:
          type: array
          description: The capability pack resolved to concrete tools. What is not here cannot be invoked.
          items: { type: string }
        budget: { $ref: '#/components/schemas/Budget' }
        triggers:
          type: array
          items: { $ref: '#/components/schemas/AgentTrigger' }
        memoryLearning:
          allOf: [{ $ref: '#/components/schemas/MemoryLearningPolicy' }]
          description: >
            Versioned policy that decides whether the platform-owned memory
            suggestion tool is available to this agent. Absent means off.
        publishedBy: { type: string }
        publishedAt: { type: string, format: date-time }
        latest:
          type: boolean
          description: Whether this is the newest published version of the agent.
        activity:
          allOf: [{ $ref: '#/components/schemas/AgentActivity' }]
          nullable: true
          description: Absent when the agent has never run, which is a different thing from having run and finished.

    AgentActivity:
      type: object
      description: >
        How the agent has been doing, aggregated from its runs. An agent has no
        state of its own to report — there is no autonomy stage yet — so what
        an operator sees is a fact about its runs.
      required: [runs, finished, waiting, costMicros]
      properties:
        runs: { type: integer, format: int64 }
        finished: { type: integer, format: int64 }
        waiting:
          type: integer
          format: int64
          description: Runs stopped for a person — awaiting approval or parked.
        costMicros: { type: integer, format: int64 }
        lastPhase: { $ref: '#/components/schemas/Phase' }
        lastRunAt: { type: string, format: date-time }

    AgentDefinition:
      type: object
      required: [name, company, area, provider, model, instructions]
      properties:
        name: { type: string }
        company:
          type: string
          description: |
            The company this agent is filed under. Area identifiers are only
            unique inside a company, so publishing must name the pair the
            author chose rather than asking the server to infer one.
        area: { type: string }
        provider: { type: string }
        model: { type: string }
        effort: { type: string }
        instructions:
          type: string
          description: What the agent is for, in the author's own words.
        tools:
          type: array
          description: The capability pack. What is not here cannot be invoked.
          items: { type: string }
        budget: { $ref: '#/components/schemas/Budget' }
        triggers:
          type: array
          items: { $ref: '#/components/schemas/AgentTrigger' }
        memoryLearning:
          allOf: [{ $ref: '#/components/schemas/MemoryLearningPolicy' }]
          description: >
            Optional. Off by default. When enabled, the agent may propose
            structured memory through the platform-owned suggestion tool; the
            platform still decides when a suggestion becomes active memory.
        emits:
          type: array
          description: |
            Events a finished run of this agent publishes (PRD SE-10). Declared
            rather than called: an agent that chose when to emit would make the
            composition graph a fact about the day rather than about the
            definitions. Context and artifacts are declarations carried by
            reference to listeners, never a blob of another agent's prose.
          items: { $ref: '#/components/schemas/AgentEvent' }
        steps:
          type: array
          description: |
            The stages of the process, each an envelope with a gate at its
            exit. Absent means one envelope holding the whole capability pack,
            which is what an agent nobody has written steps for gets.

            This is the half of a definition the Gate obeys: `reaches` is what
            a run may call while it sits at that step, so the pack is the
            ceiling and the step is the actual permission. It is also what a
            correction anchors to (PRD FU-13) — a correction about the reply
            step must not start failing because the lookup step changed.
          items: { $ref: '#/components/schemas/AgentStep' }

    AgentPublished:
      type: object
      required: [agentId, versionId, created, paused]
      properties:
        agentId: { type: string }
        versionId: { type: string }
        created:
          type: boolean
          description: |
            False when this exact definition was already published. The version
            is the digest of its bytes, so republishing identical text returns
            the version it already had.
        paused:
          type: boolean
          description: Whether the agent is allowed to start. A new one never is.
        definition:
          type: string
          description: |
            The definition as a file, exactly as published. An installation
            that keeps its agents in git commits this.

    AgentDetail:
      type: object
      required: [agent, versions]
      properties:
        agent: { $ref: '#/components/schemas/Agent' }
        instructions:
          type: string
          description: |
            The definition's body, exactly as published. Read-only: a
            specification is changed by publishing a new version, never by
            editing one that runs already reference.
        source:
          type: string
          description: Where the definition came from — a path, a repository.
        steps:
          type: array
          description: |
            The stages this version declares, in order. Absent means the agent
            declares none, which is one envelope holding the whole capability
            pack — a different thing from a single step, and worth telling
            apart on a screen.
          items: { $ref: '#/components/schemas/AgentStep' }
        emits:
          type: array
          description: |
            Events a finished run of this version publishes (PRD SE-10).
            Returned so that reading a version and publishing it again is the
            same version: a client that could not see them would drop them on
            every edit, and an agent that quietly stopped emitting takes every
            agent composed onto it down with it.
          items: { $ref: '#/components/schemas/AgentEvent' }
        versions:
          type: array
          description: Every published version, newest first.
          items: { $ref: '#/components/schemas/AgentVersion' }

    AgentVersion:
      type: object
      required: [versionId, publishedAt, latest]
      properties:
        versionId: { type: string }
        publishedBy: { type: string }
        publishedAt: { type: string, format: date-time }
        latest: { type: boolean }

    Webhook:
      type: object
      required: [path, armed]
      properties:
        path: { type: string }
        armed:
          type: boolean
          description: |
            Whether a secret exists. A declared path without one refuses
            everything, which is the safe state for a door with an agent
            behind it.
        rotatedBy: { type: string }
        rotatedAt: { type: string, format: date-time, nullable: true }

    AgentTrigger:
      type: object
      description: |
        How a run starts. A type outside this list is refused rather than
        ignored: every reader filters for the types it knows, so an
        unrecognised one publishes, prints back on the screen as configured,
        and fires nothing — with no error state that describes it.
      required: [type]
      properties:
        type:
          type: string
          description: |
            `channel` names no conversation and carries no other field. The
            agent declares that it *may* be started by an ask in a conversation
            of its own scope; which conversations belong to which scope is
            administrative. An author naming one would be choosing who may
            start their agent, and that is the same separation that makes
            classifying a tool the Curator's act and not theirs.

            An agent that does not declare it cannot be started by any message,
            however the conversations are mapped.
          enum: [cron, webhook, event, channel]
        schedule: { type: string }
        path: { type: string }
        event: { type: string }

    AgentEvent:
      type: object
      required: [event]
      description: |
        One event this agent publishes when a run finishes. The event name is
        what starts listeners. Context and artifacts are small declarations
        about what the listener may ask for by reference; they are not a direct
        call to another agent and not another agent's prompt or prose.
      properties:
        event: { type: string }
        context:
          type: string
          description: The shared work context kind this event belongs to.
        artifacts:
          type: array
          description: Artifact kinds the listener may retrieve by reference.
          items: { type: string }

    Budget:
      type: object
      description: The ceilings a run is checked against. Every dimension is enforced at the Gate.
      properties:
        micros: { type: integer, format: int64 }
        tokens: { type: integer, format: int64 }
        toolCalls: { type: integer, format: int64 }
        steps: { type: integer, format: int64 }
        wallClockMs: { type: integer, format: int64 }

    RunStats:
      type: object
      required: [total, byPhase, ended]
      properties:
        total:
          type: integer
          format: int64
          description: Runs matching the filter, not runs returned.
        byPhase:
          type: object
          description: Runs per phase. A phase with no runs is absent, so "none" is distinguishable from "not measured".
          additionalProperties: { type: integer, format: int64 }
        ended:
          type: integer
          format: int64
          description: How many runs the median was computed over.
        medianDurationMs:
          type: integer
          format: int64
          nullable: true
          description: Median wall-clock duration of runs that ended. Absent when none have.
        p95DurationMs:
          type: integer
          format: int64
          nullable: true
          description: |
            The slow tail, over the same runs as the median. On its own a
            median says nothing about the runs people complain about.

    RuntimeHealth:
      type: object
      required: [byPhase, queue, failures, toolFailures, channelFailures, egressDenials]
      properties:
        byPhase:
          type: object
          additionalProperties: { type: integer, format: int64 }
          description: Active runs per phase, plus terminal runs last seen in the requested window.
        queue: { $ref: '#/components/schemas/RuntimeQueue' }
        failures:
          type: array
          items: { $ref: '#/components/schemas/RuntimeFailureBucket' }
        toolFailures:
          type: array
          description: |
            Failed tool results seen in the requested window. Codes are bounded
            to the same stable MCP vocabulary used by worker metrics; run ids,
            tool arguments and tool response bodies are not included.
          items: { $ref: '#/components/schemas/RuntimeToolFailureBucket' }
        channelFailures:
          type: array
          description: |
            Channel delivery failures last seen in the requested window. Codes
            are bounded to the same stable channel vocabulary used by worker
            metrics; Slack text, channel labels and delivery bodies are not
            included.
          items: { $ref: '#/components/schemas/RuntimeChannelFailureBucket' }
        egressDenials:
          type: array
          description: |
            Stdio MCP egress proxy denials last seen in the requested window.
            Codes are bounded to the same stable egress vocabulary used by
            worker metrics; URL paths, query strings, headers, bodies and tool
            arguments are not included. This global signal is empty when the
            caller cannot read the installation-wide runtime view.
          items: { $ref: '#/components/schemas/RuntimeEgressDenialBucket' }

    RuntimeQueue:
      type: object
      required: [ready, leased, backingOff, expiredLeases]
      properties:
        ready:
          type: integer
          format: int64
          description: Claimable runs ready for a worker now.
        leased:
          type: integer
          format: int64
          description: Claimable runs currently held by workers.
        backingOff:
          type: integer
          format: int64
          description: Claimable runs waiting for their retry time.
        expiredLeases:
          type: integer
          format: int64
          description: Runs whose worker lease expired before release.
        oldestReadyAt:
          type: string
          format: date-time
          nullable: true
          description: Oldest retry time among runs ready for a worker.

    RuntimeFailureBucket:
      type: object
      required: [code, runs, lastAt]
      properties:
        code: { type: string }
        provider: { type: string }
        status: { type: integer }
        retryable: { type: boolean }
        runs: { type: integer, format: int64 }
        lastAt: { type: string, format: date-time }

    RuntimeToolFailureBucket:
      type: object
      required: [code, calls, runs, lastAt]
      properties:
        code: { type: string }
        calls:
          type: integer
          format: int64
          description: Tool return failures with this code.
        runs:
          type: integer
          format: int64
          description: Distinct runs that saw at least one failure with this code.
        lastAt: { type: string, format: date-time }

    RuntimeChannelFailureBucket:
      type: object
      required: [code, attempts, conversations, scopeWide, runs, firstAt, lastAt]
      properties:
        code: { type: string }
        attempts:
          type: integer
          format: int64
          description: Delivery attempts that failed with this code.
        conversations:
          type: integer
          format: int64
          description: Distinct known channel conversations affected by this code.
        scopeWide:
          type: boolean
          description: At least one failure happened before the affected conversations were known.
        runs:
          type: integer
          format: int64
          description: Distinct runs whose announcement failed with this code.
        firstAt:
          type: string
          format: date-time
          description: First time this durable source saw the failure form.
        lastAt:
          type: string
          format: date-time
          description: Most recent time this durable source saw the failure form.

    RuntimeEgressDenialBucket:
      type: object
      required: [code, attempts, servers, destinations, firstAt, lastAt]
      properties:
        code: { type: string }
        attempts:
          type: integer
          format: int64
          description: Proxy requests that failed with this code.
        servers:
          type: integer
          format: int64
          description: Distinct stdio MCP server proxy instances that saw this code.
        destinations:
          type: integer
          format: int64
          description: Distinct known host and port pairs affected by this code.
        firstAt:
          type: string
          format: date-time
          description: First time this durable source saw the failure form.
        lastAt:
          type: string
          format: date-time
          description: Most recent time this durable source saw the failure form.

    DecisionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RecordedDecision' }

    RecordedDecision:
      type: object
      required: [runId, seq, at, verdict]
      properties:
        runId: { type: string }
        seq: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        scope: { $ref: '#/components/schemas/Scope' }
        agentId: { type: string }
        tool: { type: string }
        verdict: { $ref: '#/components/schemas/Verdict' }
        rule:
          type: string
          description: The rule that applied. The feed names it rather than a category.

    Throughput:
      type: object
      required: [buckets]
      properties:
        buckets:
          type: array
          items: { $ref: '#/components/schemas/ThroughputBucket' }

    ThroughputBucket:
      type: object
      required: [at, total, byPhase, byAgent, micros]
      properties:
        at:
          type: string
          format: date-time
          description: The start of the hour, in UTC.
        total: { type: integer, format: int64 }
        micros:
          type: integer
          format: int64
          description: What the hour cost, read off the same rows as the count.
        byPhase:
          type: object
          description: Runs per phase within the hour. A phase with none is absent.
          additionalProperties: { type: integer, format: int64 }
        byAgent:
          type: object
          description: |
            The same hour split by who ran. Travels with the phase split rather
            than in its own request: every screen that wants one wants the
            other, and two queries over the same rows can disagree if a run
            finishes between them.
          additionalProperties: { type: integer, format: int64 }

    RunPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Run' }
        nextCursor: { type: string, nullable: true }

    Step:
      type: object
      required: [seq, kind, at, hash]
      properties:
        seq: { type: integer, format: int64 }
        kind: { $ref: '#/components/schemas/StepKind' }
        at: { type: string, format: date-time }
        cost: { $ref: '#/components/schemas/Cost' }
        labels:
          type: array
          items: { type: string }
        policyHash: { type: string }
        payload:
          type: object
          additionalProperties: true
          description: |
            Kind-specific detail. Bulky content is not inlined: payloads carry
            a reference into object storage plus a digest, because arguments
            and results routinely contain personal data.
        hash:
          type: string
          description: Hex-encoded SHA-256 sealing this step to the previous one.

    StepContent:
      type: object
      required: [seq, digest, content]
      properties:
        seq: { type: integer, format: int64 }
        digest:
          type: string
          description: |
            Hex-encoded SHA-256 of the content, as recorded in the step. A
            caller that hashes the body and gets a different value is not
            looking at what the chain sealed.
        content:
          type: string
          description: The bytes, as text. JSON arguments arrive as a JSON string.

    StepPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Step' }
        nextSeq: { type: integer, format: int64, nullable: true }

    AgentTemplate:
      type: object
      required: [id, name, summary, instructions, needs]
      properties:
        id: { type: string }
        name: { type: string }
        summary:
          type: string
          description: The one line that decides whether somebody opens it.
        area:
          type: string
          description: A suggestion. The author's own grant decides where it lands.
        needs:
          type: array
          description: |
            The roles this agent expects to reach, in the author's language —
            "read the customer's history", not "crm.lookup".
          items: { type: string }
        instructions: { type: string }
        triggers:
          type: array
          items: { $ref: '#/components/schemas/AgentTrigger' }
        budget: { $ref: '#/components/schemas/Budget' }

    EventEdge:
      type: object
      required: [event]
      properties:
        event: { type: string }
        from:
          type: string
          description: The agent that publishes it. Absent means nothing does.
        to:
          type: string
          description: The agent it starts. Absent means nobody listens.

    FlowFinding:
      type: object
      required: [paths, unclassified]
      properties:
        paths:
          type: array
          items: { $ref: '#/components/schemas/FlowPath' }
        unclassified:
          type: array
          items: { type: string }
          description: |
            Tools the Curator has not ruled on. Naming them is most of what
            this check does for them: an unclassified tool is refused at run
            time, so an agent published holding one stops at its first call —
            and no taint path through it can be reported either way.

    FlowPath:
      type: object
      required: [from, to, effect]
      properties:
        from:
          type: string
          description: The tool that brings data in from outside.
        to:
          type: string
          description: The tool that acts on the world with it.
        fromStep: { type: string }
        toStep: { type: string }
        effect: { $ref: '#/components/schemas/Effect' }

    ReplayReport:
      type: object
      required: [runId, decisions, reproduced, faithful, divergences]
      properties:
        runId: { type: string }
        decisions:
          type: integer
          description: How many gate decisions the run recorded.
        reproduced:
          type: integer
          description: How many produced the same verdict, for the same reason.
        faithful:
          type: boolean
          description: True when every decision came out the same way.
        divergences:
          type: array
          items: { $ref: '#/components/schemas/Divergence' }

    Divergence:
      type: object
      required: [seq]
      properties:
        seq: { type: integer, format: int64 }
        tool: { type: string }
        was: { $ref: '#/components/schemas/Verdict' }
        now: { $ref: '#/components/schemas/Verdict' }
        wasRule: { type: string }
        nowRule: { type: string }
        why:
          type: string
          description: |
            Set when the decision could not be re-derived at all. Not a
            divergence and not a match — reporting it as either would be a lie.

    CompensationPlan:
      type: object
      required: [acts]
      properties:
        acts:
          type: array
          items: { $ref: '#/components/schemas/CompensationAct' }

    CompensationAct:
      type: object
      required: [tool, seq]
      properties:
        tool:
          type: string
          description: The call being undone.
        seq:
          type: integer
          format: int64
          description: Where in the run it happened.
        undo:
          type: string
          description: |
            The tool that takes it back, as the Curator classified it. Absent
            when nothing does, which is the case a person has to handle.

    CompensationResult:
      type: object
      required: [outcomes]
      properties:
        outcomes:
          type: array
          items:
            type: object
            required: [act, done]
            properties:
              act: { $ref: '#/components/schemas/CompensationAct' }
              done:
                type: boolean
                description: Whether the undo ran and the tool accepted it.
              why:
                type: string
                description: |
                  Why it did not. Empty on success. This is the line somebody
                  acts on: it names something still standing in the world.

    AbandonRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Why the run cannot go on. Recorded in the trail.
        compensate:
          type: boolean
          default: true
          description: |
            Undo what the run left standing. False ends the run and leaves the
            world as it is — which is sometimes right, and is recorded as the
            deliberate choice it is.

    VerifyResult:
      type: object
      required: [valid, stepsChecked]
      properties:
        valid: { type: boolean }
        stepsChecked: { type: integer, format: int64 }
        brokenAtSeq:
          type: integer
          format: int64
          nullable: true
          description: The first step whose link failed, when valid is false.

    PendingApproval:
      type: object
      required: [runId, tool, requestedAt, atSeq]
      properties:
        runId: { type: string }
        scope: { $ref: '#/components/schemas/Scope' }
        agentId: { type: string }
        tool: { type: string }
        effect: { $ref: '#/components/schemas/Effect' }
        rule:
          type: string
          description: The rule that required approval. The trail never says "denied by policy" — it names the rule.
        reason: { type: string }
        requestedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
        atSeq: { type: integer, format: int64 }

    ApprovalPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PendingApproval' }
        nextCursor: { type: string, nullable: true }

    ApprovalDecision:
      type: object
      required: [approved, atSeq]
      properties:
        approved: { type: boolean }
        atSeq:
          type: integer
          format: int64
          description: |
            Sequence number of the approval_requested step being answered.
            Required so a stale browser tab cannot approve an action that a
            later step already superseded.
        note: { type: string }

    CostBucket:
      type: object
      required: [key, cost, runs]
      properties:
        key: { type: string }
        cost: { $ref: '#/components/schemas/Cost' }
        runs: { type: integer, format: int64 }

    CostRollup:
      type: object
      required: [from, to, groupBy, total, buckets]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        groupBy: { type: string }
        total: { $ref: '#/components/schemas/Cost' }
        buckets:
          type: array
          items: { $ref: '#/components/schemas/CostBucket' }

    PlanningSpendBucket:
      type: object
      required: [provider, model, agent, cost, calls, runs, unpriced]
      properties:
        provider:
          type: string
          description: Empty on the agent cut, where the bucket can include several models.
        model:
          type: string
          description: Empty on the agent cut, where the bucket can include several models.
        agent:
          type: string
          description: Empty on the model cut.
        cost: { $ref: '#/components/schemas/Cost' }
        calls: { type: integer, format: int64 }
        runs:
          type: integer
          format: int64
          description: |
            Distinct runs inside this bucket. On the model cut a run that used
            two models contributes to both model buckets, so this is not a
            global unique-run total.
        unpriced:
          type: integer
          format: int64
          description: Planning calls in this bucket that had no configured rate.

    PlanningSpendRollup:
      type: object
      required: [from, to, groupBy, total, calls, unpriced, buckets]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        groupBy: { type: string, enum: [model, agent] }
        projectedFrom:
          type: string
          format: date-time
          description: |
            When this projection started. Earlier planning steps did not name
            the effective provider/model pair, so this rollup starts here
            instead of guessing history.
        total: { $ref: '#/components/schemas/Cost' }
        calls: { type: integer, format: int64 }
        unpriced:
          type: integer
          format: int64
          description: Planning calls in the response that had no configured rate.
        buckets:
          type: array
          items: { $ref: '#/components/schemas/PlanningSpendBucket' }

    BudgetAlert:
      type: object
      required: [scope, threshold, spentMicros, ceilingMicros, since]
      properties:
        scope: { $ref: '#/components/schemas/Scope' }
        threshold:
          type: integer
          description: The percentage crossed — 50, 80 or 100.
        spentMicros: { type: integer, format: int64 }
        ceilingMicros: { type: integer, format: int64 }
        since:
          type: string
          format: date-time
          description: The start of the period the spend is measured over.

    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
