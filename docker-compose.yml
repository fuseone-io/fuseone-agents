# Development stack. Production is one binary plus a Postgres the customer
# already operates (PRD DE-01); this file exists so a contributor gets a
# database in one command, not to describe a deployment.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: agents
      POSTGRES_PASSWORD: agents
      POSTGRES_DB: agents
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agents"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      # Persistent so a `make dev` restart does not throw away the installation
      # you just claimed: the setup token is single use, and re-claiming after
      # every restart makes the first-run flow something to work around rather
      # than something to test. `make reset` throws it away deliberately.
      #
      # Postgres 18 expects the mount at /var/lib/postgresql, not the data
      # subdirectory it used through 17.
      - pgdata:/var/lib/postgresql

  # A customer database reached by the governed SQL connector tests. It is
  # deliberately not FuseOne's own store: proving READ ONLY, TLS and dynamic
  # credentials against the ledger database would prove the guarantees at the
  # one destination the connector must never reach.
  sql-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: sqladmin
      POSTGRES_PASSWORD: sqladmin
      POSTGRES_DB: appx_test
    entrypoint: ["/bin/sh", "/usr/local/bin/sql-test-postgres-entrypoint.sh"]
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/sql-test-certs/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/sql-test-certs/server.key
      - -c
      - password_encryption=scram-sha-256
    ports: ["5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqladmin -d appx_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./.dev/sql-postgres-certs/server.crt:/test-certs/server.crt:ro
      - ./.dev/sql-postgres-certs/server.key:/test-certs/server.key:ro
      - ./scripts/sql-test-postgres-entrypoint.sh:/usr/local/bin/sql-test-postgres-entrypoint.sh:ro
      - ./scripts/sql-test-init.sql:/docker-entrypoint-initdb.d/010-sql-test.sql:ro

volumes:
  pgdata:
