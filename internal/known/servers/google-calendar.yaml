server: google-calendar
title: Google Calendar
category: operations
publisher: Google
docs: https://developers.google.com/workspace/guides/configure-mcp-servers
docsFrom: publisher
provenance: documentation
status: published
config: [credential]
transport: http
url: https://calendarmcp.googleapis.com/mcp/v1
auth: >
  OAuth 2.0 access token for the Google Calendar scopes this agent needs.
  Prefer the narrow event/calendar scopes and a dedicated OAuth client; the
  token reaches the user's calendars before the Gate sees any individual tool.
authModes:
  - type: oauth2
    principal: user
    label: Google OAuth 2.0
    scopes:
      - https://www.googleapis.com/auth/calendar.calendarlist.readonly
      - https://www.googleapis.com/auth/calendar.events.freebusy
      - https://www.googleapis.com/auth/calendar.events.readonly
      - https://www.googleapis.com/auth/calendar.events
    note: Requires an OAuth client ID and secret; scopes decide which calendars and event operations the user can grant.

note: >
  Google Workspace MCP servers are in Developer Preview and are split per
  product. Keep Calendar separate from Gmail, Drive and Chat so a scheduling
  agent does not receive a token that can also read mail or files.

suggestions:
  - tool: list_calendars
    effect: read
    why: Lists the calendars the token can see and changes nothing.

  - tool: list_events
    effect: read
    untrusted: true
    why: >
      Event titles, descriptions and locations are text people wrote. They are
      useful context and still attacker-shaped input if an invited user chose
      the words.

  - tool: search_events
    effect: read
    untrusted: true
    why: Returns event content by query, with the same authorship risk.

  - tool: get_event
    effect: read
    untrusted: true
    why: Retrieves one event, including user-authored text.

  - tool: suggest_time
    effect: read
    why: Computes candidate times from calendar availability and writes nothing.

  - tool: create_event
    effect: write
    why: >
      Adds an event and may notify attendees. It is not a payment or deletion,
      but it changes people's calendars.

  - tool: update_event
    effect: write
    why: >
      Changes an existing event and can move time, attendees or notifications.
      That is visible work on somebody's calendar.

  - tool: respond_to_event
    effect: write
    why: Records an RSVP as the authenticated user.

  - tool: delete_event
    effect: destructive
    why: >
      Removes an event. A new event can be created later, but the original
      invitation and its history are not restored by this tool.
